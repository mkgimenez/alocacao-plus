  function fecharSugestoesBusca() {
    const popover = document.getElementById('busca-sugestoes-dropdown');
    if (popover) {
      popover.style.display = 'none';
      popover.innerHTML = '';
    }
    indiceSugestaoTeclado = -1;
    const inpBusca = document.getElementById('input-busca-sala');
    if (inpBusca) {
      inpBusca.setAttribute('aria-expanded', 'false');
    }
  }

  function selecionarSugestao(valor, tipo) {
    if (tipo === 'acao') {
      fecharSugestoesBusca();
      if (valor === 'agora') {
        selecionarHorarioAgora();
      } else if (valor === 'hoje') {
        selecionarHoje();
      } else if (valor === 'limpar') {
        resetarTodosFiltros();
      }
      return;
    }

    const inpBusca = document.getElementById('input-busca-sala');
    if (inpBusca) {
      inpBusca.value = valor;
      inpBusca.focus();
    }
    fecharSugestoesBusca();
    aoBuscarSala(valor, true);
  }

  function configurarAutocompleteBusca() {
    if (typeof reindexarBuscaDaGradeAtual === 'function') {
      reindexarBuscaDaGradeAtual();
    }

    const inpBusca = document.getElementById('input-busca-sala');
    const popover = document.getElementById('busca-sugestoes-dropdown');
    if (!inpBusca || !popover) return;

    inpBusca.addEventListener('focus', function() {
      atualizarSugestoesBusca(this.value);
    });

    inpBusca.addEventListener('input', function() {
      atualizarSugestoesBusca(this.value);
    });

    popover.addEventListener('mousedown', function(e) {
      const chip = e.target.closest('.chip-sugestao');
      if (chip) {
        e.preventDefault();
      }
    });

    popover.addEventListener('click', function(e) {
      const chip = e.target.closest('.chip-sugestao');
      if (chip) {
        const valor = chip.dataset.valor;
        const tipo = chip.dataset.tipo;
        selecionarSugestao(valor, tipo);
      }
    });

    inpBusca.addEventListener('keydown', function(e) {
      if (popover.style.display === 'none') {
        if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
          atualizarSugestoesBusca(this.value);
          e.preventDefault();
        }
        return;
      }

      const chips = Array.from(popover.querySelectorAll('.chip-sugestao'));
      if (chips.length === 0) return;

      if (e.key === 'ArrowDown' || e.key === 'Tab') {
        e.preventDefault();
        chips.forEach(c => c.classList.remove('selecionado-teclado'));
        indiceSugestaoTeclado = (indiceSugestaoTeclado + 1) % chips.length;
        chips[indiceSugestaoTeclado].classList.add('selecionado-teclado');
        chips[indiceSugestaoTeclado].scrollIntoView({ block: 'nearest' });
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        chips.forEach(c => c.classList.remove('selecionado-teclado'));
        indiceSugestaoTeclado = (indiceSugestaoTeclado - 1 + chips.length) % chips.length;
        chips[indiceSugestaoTeclado].classList.add('selecionado-teclado');
        chips[indiceSugestaoTeclado].scrollIntoView({ block: 'nearest' });
      } else if (e.key === 'Enter') {
        if (indiceSugestaoTeclado >= 0 && chips[indiceSugestaoTeclado]) {
          e.preventDefault();
          const chipSel = chips[indiceSugestaoTeclado];
          selecionarSugestao(chipSel.dataset.valor, chipSel.dataset.tipo);
        }
      } else if (e.key === 'Escape') {
        fecharSugestoesBusca();
      }
    });

    document.addEventListener('click', function(e) {
      const wrapper = document.getElementById('busca-sala-wrapper');
      if (wrapper && !wrapper.contains(e.target)) {
        fecharSugestoesBusca();
      }
    });
  }

  // --------------------------------------------------------------------------
  // Renderização da Grade e Aplicação de Filtros Reativa no Navegador
  // --------------------------------------------------------------------------
  // --------------------------------------------------------------------------
  // Resolução Temporal Inteligente de Horários e Intervalos da Grade
  // --------------------------------------------------------------------------
  /**
   * Converte minutos restantes em texto conciso e legível para tooltips e badges.
   * @param {number} minutos - Quantidade de minutos restantes
   * @returns {string} Ex: 'em 5 min', 'em 1h 20min', 'em 2h'
   */
  function formatarTempoRestanteGrade(minutos) {
    if (minutos <= 0) return '';
    if (minutos < 60) return `em ${minutos} min`;
    const h = Math.floor(minutos / 60);
    const m = minutos % 60;
    return m === 0 ? `em ${h}h` : `em ${h}h ${m}min`;
  }

  /**
   * Determina com precisão temporal o estado atual da grade (aula, intervalo ou pré/pós-expediente).
   * Protegido contra falsos intervalos em grades filtradas por busca ou horário.
   *
   * @param {Array} slotsAtivos - Colunas visíveis na grade [{ slot, cIdx }]
   * @param {Array} [todosSlots] - Grade mestra completa de slots do campus (dados.slots)
   * @param {Date} [agoraCustom] - Objeto Date opcional para injeção de dependência e testes
   * @returns {Object} { tipo, idxSlot, slot, textoTooltip, icone, tagLabel }
   */
  function obterEstadoTemporalGrade(slotsAtivos, todosSlots = null, agoraCustom = null) {
    if (!slotsAtivos || slotsAtivos.length === 0) {
      return { tipo: 'fora_dia', idxSlot: -1, slot: null, textoTooltip: '', icone: '', tagLabel: '' };
    }

    const agora = agoraCustom || new Date();
    const diaNum = agora.getDay();
    const mapaDiaReal = { 1: 'seg', 2: 'ter', 3: 'qua', 4: 'qui', 5: 'sex', 6: 'sab' };
    const chaveDiaHoje = mapaDiaReal[diaNum];
    if (!chaveDiaHoje) {
      return { tipo: 'fora_dia', idxSlot: -1, slot: null, textoTooltip: '', icone: '', tagLabel: '' };
    }

    const agoraMin = agora.getHours() * 60 + agora.getMinutes();

    // 1. Grade mestra do dia (evita falsos intervalos se slots estiverem filtrados)
    const fonteMestra = (todosSlots && todosSlots.length > 0) ? todosSlots : slotsAtivos.map(item => item.slot);
    const slotsMestreHoje = [];
    fonteMestra.forEach(s => {
      if (s && s.dia === chaveDiaHoje && s.horaInicioMin !== null && s.horaFimMin !== null) {
        slotsMestreHoje.push(s);
      }
    });

    if (slotsMestreHoje.length === 0) {
      return { tipo: 'fora_dia', idxSlot: -1, slot: null, textoTooltip: '', icone: '', tagLabel: '' };
    }
    slotsMestreHoje.sort((a, b) => a.horaInicioMin - b.horaInicioMin);

    // Mapeia os slots visíveis de hoje preservando seu índice original em slotsAtivos
    const slotsVisiveisHoje = [];
    slotsAtivos.forEach((item, idx) => {
      const s = item.slot;
      if (s && s.dia === chaveDiaHoje && s.horaInicioMin !== null) {
        slotsVisiveisHoje.push({ idx: idx, slot: s });
      }
    });
    slotsVisiveisHoje.sort((a, b) => a.slot.horaInicioMin - b.slot.horaInicioMin);

    // 2. Verifica se a universidade está em horário de aula neste momento
    let slotAulaMestre = null;
    for (let i = 0; i < slotsMestreHoje.length; i++) {
      const s = slotsMestreHoje[i];
      if (agoraMin >= s.horaInicioMin && agoraMin < s.horaFimMin) {
        slotAulaMestre = s;
        break;
      }
    }

    if (slotAulaMestre) {
      const itemVisivel = slotsVisiveisHoje.find(item => item.slot.horaInicioMin === slotAulaMestre.horaInicioMin);
      const idxVisivel = itemVisivel ? itemVisivel.idx : -1;
      const rotulo = slotAulaMestre.label || slotAulaMestre.textoInicio;
      return {
        tipo: 'aula',
        idxSlot: idxVisivel,
        slot: itemVisivel ? itemVisivel.slot : null,
        textoTooltip: idxVisivel !== -1 ? `${rotulo} (Horário Atual em Andamento)` : '',
        icone: idxVisivel !== -1 ? '⚡ ' : '',
        tagLabel: ''
      };
    }

    // 3. Antes da primeira aula do dia na universidade (Pré-Expediente)
    const primeiroMestre = slotsMestreHoje[0];
    if (agoraMin < primeiroMestre.horaInicioMin) {
      const diff = primeiroMestre.horaInicioMin - agoraMin;
      const primeiroVisivel = slotsVisiveisHoje[0] || null;
      const idxVisivel = primeiroVisivel ? primeiroVisivel.idx : -1;
      const slotAlvo = primeiroVisivel ? primeiroVisivel.slot : null;
      const rotulo = slotAlvo ? (slotAlvo.label || slotAlvo.textoInicio) : '';
      const txtInicio = slotAlvo ? (slotAlvo.textoInicio || '') : '';
      const infoTempo = formatarTempoRestanteGrade(diff);
      const infoFmt = infoTempo ? ` (${infoTempo})` : '';

      return {
        tipo: 'pre_expediente',
        idxSlot: idxVisivel,
        slot: slotAlvo,
        textoTooltip: slotAlvo ? `${rotulo} (Aulas iniciam às ${txtInicio}${infoFmt})` : '',
        icone: idxVisivel !== -1 ? '⚡ ' : '',
        tagLabel: ''
      };
    }

    // 4. Após a última aula do dia na universidade (Pós-Expediente)
    const ultimoMestre = slotsMestreHoje[slotsMestreHoje.length - 1];
    if (agoraMin >= ultimoMestre.horaFimMin) {
      return { tipo: 'pos_expediente', idxSlot: -1, slot: null, textoTooltip: '', icone: '', tagLabel: '' };
    }

    // 5. Em intervalo acadêmico real entre aulas da universidade
    const proxMestre = slotsMestreHoje.find(s => s.horaInicioMin > agoraMin);
    if (proxMestre) {
      const diff = proxMestre.horaInicioMin - agoraMin;
      const itemVisivel = slotsVisiveisHoje.find(item => item.slot.horaInicioMin === proxMestre.horaInicioMin);
      const idxVisivel = itemVisivel ? itemVisivel.idx : -1;
      const slotAlvo = itemVisivel ? itemVisivel.slot : null;
      const rotulo = proxMestre.label || proxMestre.textoInicio;
      const txtInicio = proxMestre.textoInicio || '';
      const infoTempo = formatarTempoRestanteGrade(diff);
      const infoFmt = infoTempo ? ` (${infoTempo})` : '';

      return {
        tipo: 'intervalo',
        idxSlot: idxVisivel,
        slot: slotAlvo,
        textoTooltip: `${rotulo} (Intervalo em andamento — Próxima aula às ${txtInicio}${infoFmt})`,
        icone: idxVisivel !== -1 ? '⚡ ' : '',
        tagLabel: ''
      };
    }

    return { tipo: 'fora_dia', idxSlot: -1, slot: null, textoTooltip: '', icone: '', tagLabel: '' };
  }

  function renderizarGrade() {
    aplicarFiltrosEAtualizarVisualizacao();
  }

  function aplicarFiltrosEAtualizarVisualizacao() {
    if (!estadoApp.dadosBrutos) return;

    const dados = estadoApp.dadosBrutos;
    const todosSlots = dados.slots || [];
    const todasSalas = dados.salas || [];
    const matrizGrade = dados.grade || [];

    // 1. Determina quais slots de horários estão inicialmente elegíveis (Filtros de Dias e Horário)
    const temFiltroDias = !estadoApp.diasSelecionados.has('todos');
    const hIni = estadoApp.horaInicioMin;
    const hFim = estadoApp.horaFimMin;

    const slotsIniciais = [];

    todosSlots.forEach((slot, cIdx) => {
      // Filtro de dia
      if (temFiltroDias && !estadoApp.diasSelecionados.has(slot.dia)) {
        return;
      }

      // Filtro de horário
      if (hIni !== null || hFim !== null) {
        if (slot.horaInicioMin !== null && slot.horaFimMin !== null) {
          if (hIni !== null && slot.horaFimMin <= hIni) return;
          if (hFim !== null && slot.horaInicioMin >= hFim) return;
        } else {
          return;
        }
      }

      slotsIniciais.push({ slot: slot, cIdx: cIdx });
    });

    // 2. Parâmetros de Filtros de Bloco, Capacidade e Busca Textual
    const temFiltroBlocos = !estadoApp.blocosSelecionados.has('todos');
    const capMin = estadoApp.capacidadeMin;
    const buscaLimpa = String(estadoApp.buscaSala || '').trim();
    const termoBuscaNorm = normalizarTexto(buscaLimpa);
    const tokensBusca = extrairTokensBusca(termoBuscaNorm);
    const temBusca = tokensBusca.length > 0;
    const apenasLivres = estadoApp.apenasLivres && !temBusca;

    // 3. Foco em Colunas com Match (filtra colunas mostrando apenas as que têm match)
    let slotsAtivos = slotsIniciais;
    let colunasFocadas = false;
    let temColunasComMatch = false;

    if (temBusca) {
      const colunasComMatch = new Set();

      todasSalas.forEach((sala, rIdx) => {
        if (temFiltroBlocos && !estadoApp.blocosSelecionados.has(sala.bloco)) return;
        if (capMin > 0 && sala.capacidadeNum < capMin) return;

        const linhaCels = matrizGrade[rIdx] || [];
        for (let i = 0; i < slotsIniciais.length; i++) {
          const cIdx = slotsIniciais[i].cIdx;
          const celEfetiva = obterCelulaEfetiva(linhaCels, cIdx);
          if (celEfetiva && (celEfetiva.t || celEfetiva.d) && celulaCorrespondeABusca(celEfetiva, tokensBusca)) {
            colunasComMatch.add(cIdx);
          }
        }
      });

      if (colunasComMatch.size > 0) {
        temColunasComMatch = true;
        if (estadoApp.focarColunasMatch !== false) {
          slotsAtivos = slotsIniciais.filter(item => colunasComMatch.has(item.cIdx));
          colunasFocadas = true;
        }
      }
    }

    // Atualiza a visibilidade e rótulo do botão de foco em colunas e estado do botão livres
    atualizarBotaoColunasMatch(temColunasComMatch);
    atualizarEstadoBotaoLivres();

    // Agrupa slots ativos por dia para construir o cabeçalho superior
    const mapaDiasAtivos = {};
    slotsAtivos.forEach(item => {
      const d = item.slot.dia;
      if (!mapaDiasAtivos[d]) {
        const infoDia = (dados.dias || []).find(x => x.chave === d) || { nome: d };
        mapaDiasAtivos[d] = {
          chave: d,
          nome: infoDia.nome,
          slots: []
        };
      }
      mapaDiasAtivos[d].slots.push(item);
    });

    // 4. Filtra as salas que satisfazem OS OUTROS FILTROS (Bloco, Capacidade, Busca Textual e Salas Livres)
    const salasElegiveis = [];

    todasSalas.forEach((sala, rIdx) => {
      // Filtro de bloco
      if (temFiltroBlocos && !estadoApp.blocosSelecionados.has(sala.bloco)) {
        return;
      }

      // Filtro de capacidade mínima
      if (capMin > 0 && sala.capacidadeNum < capMin) {
        return;
      }

      const linhaCels = matrizGrade[rIdx] || [];

      // Filtro de busca textual (disciplina, docente, conteúdo da célula ou nome da sala)
      if (temBusca) {
        if (!salaCorrespondeABusca(sala, linhaCels, slotsAtivos, tokensBusca, termoBuscaNorm)) {
          return;
        }
      }

      // Filtro "Apenas Salas Livres" nos slots ativos (respeitando dias e horários selecionados)
      if (apenasLivres && slotsAtivos.length > 0) {
        let ocupada = false;

        for (let i = 0; i < slotsAtivos.length; i++) {
          const cIdx = slotsAtivos[i].cIdx;
          const celEfetiva = obterCelulaEfetiva(linhaCels, cIdx);
          if (celEfetiva && celEfetiva.t && celEfetiva.t.trim() !== '') {
            ocupada = true;
            break;
          }
        }

        if (ocupada) {
          return;
        }
      }

      salasElegiveis.push({ sala: sala, rIdx: rIdx });
    });

    // 5. Atualiza dinamicamente os chips da seção de Salas Específicas
    // Exibe apenas as salas que satisfazem todos os outros filtros ativos
    atualizarChipsSalas(salasElegiveis);

    // 6. Aplica a seleção individual de salas sobre as salas elegíveis
    const temFiltroSalas = !estadoApp.salasSelecionadas.has('todas');
    const salasVisiveis = temFiltroSalas
      ? salasElegiveis.filter(item => estadoApp.salasSelecionadas.has(item.sala.nome))
      : salasElegiveis;

    estadoApp._salasVisiveisAtuais = salasVisiveis;
    estadoApp._slotsAtivosAtuais = slotsAtivos;

    // 7. Atualiza os Contadores Informativos
    const txtContador = document.getElementById('txt-contador-resultados');
    if (txtContador) {
      let infoBusca = '';
      if (temBusca) {
        if (colunasFocadas) {
          infoBusca = ` • Filtro: "<strong>${escapeHtml(buscaLimpa)}</strong>" (focando ${slotsAtivos.length} de ${slotsIniciais.length} horários)`;
        } else {
          infoBusca = ` • Filtro: "<strong>${escapeHtml(buscaLimpa)}</strong>"`;
        }
      }
      txtContador.innerHTML = `Exibindo <strong>${salasVisiveis.length}</strong> de ${todasSalas.length} salas • <strong>${slotsAtivos.length}</strong> horários visíveis${infoBusca}.`;
      txtContador.title = `Exibindo ${salasVisiveis.length} de ${todasSalas.length} salas • ${slotsAtivos.length} horários visíveis${temBusca ? ' • Filtro: ' + buscaLimpa : ''}.`;
    }

    const containerTab = document.getElementById('grade-tabela-container');
    const containerVazio = document.getElementById('estado-vazio');

    if (salasVisiveis.length === 0 || slotsAtivos.length === 0) {
      if (containerTab) containerTab.style.display = 'none';
      if (containerVazio) {
        containerVazio.style.display = 'flex';
        if (slotsAtivos.length === 0) {
          containerVazio.querySelector('h3').textContent = 'Nenhum horário selecionado';
          containerVazio.querySelector('p').textContent = 'Selecione ao menos um dia da semana ou amplie a faixa de horários.';
        } else if (temBusca) {
          const emCarregamentoJupiter = Boolean(
            (estadoApp.filaJupiter && estadoApp.filaJupiter.length > 0) || estadoApp.jupiterRequisicaoEmVoo
          );
          containerVazio.querySelector('h3').textContent = `Nenhuma sala encontrada para "${escapeHtml(buscaLimpa)}"`;
          if (emCarregamentoJupiter) {
            containerVazio.querySelector('p').innerHTML = 'O sistema ainda está carregando as informações de turmas e docentes em segundo plano.<br>Por favor, <strong>aguarde a conclusão do carregamento e tente novamente</strong>.';
          } else {
            containerVazio.querySelector('p').textContent = 'Tente buscar por outra sigla, docente ou relaxar os filtros superiores de dia, bloco ou horário.';
          }
        } else {
          containerVazio.querySelector('h3').textContent = 'Nenhuma sala encontrada com os filtros atuais';
          containerVazio.querySelector('p').textContent = 'Tente relaxar os filtros de bloco, capacidade ou desmarcar "Apenas Salas Livres".';
        }
      }
      return;
    }

    if (containerVazio) containerVazio.style.display = 'none';
    if (containerTab) containerTab.style.display = 'block';

    // 4. Determina o estado temporal para destaque visual na grade (aula vigente ou intervalo)
    const estadoTemporal = obterEstadoTemporalGrade(slotsAtivos, todosSlots);

    // 5. Renderiza o Cabeçalho (THEAD)
    let theadHtml = '<tr>';
    theadHtml += '<th class="col-fixa-sala" rowspan="2">Sala</th>';
    theadHtml += '<th class="col-fixa-cap" rowspan="2">Lugares</th>';

    const diasChaves = Object.keys(mapaDiasAtivos);
    const agoraHoje = new Date();
    const mapaDiaReal = { 1: 'seg', 2: 'ter', 3: 'qua', 4: 'qui', 5: 'sex', 6: 'sab' };
    const chaveDiaHoje = mapaDiaReal[agoraHoje.getDay()] || null;

    diasChaves.forEach((diaKey, dIdx) => {
      const diaObj = mapaDiasAtivos[diaKey];
      const diaClass = (dIdx % 2 === 0) ? 'dia-par' : 'dia-impar';
      const ehUltimoDia = (dIdx === diasChaves.length - 1);
      const bordaFim = !ehUltimoDia ? ' col-dia-fim' : '';
      const ehDiaHoje = (diaKey === chaveDiaHoje);
      const classeHoje = ehDiaHoje ? ' dia-hoje-atual' : '';
      const iconeHoje = ehDiaHoje ? '⚡ ' : '';
      const titleDia = ehDiaHoje ? `${diaObj.nome} (Hoje)` : diaObj.nome;
      theadHtml += `<th colspan="${diaObj.slots.length}" class="th-dia-header ${diaClass}${bordaFim}${classeHoje}" title="${titleDia}">${iconeHoje}${diaObj.nome}</th>`;
    });
    theadHtml += '</tr><tr>';

    slotsAtivos.forEach((item, sIdx) => {
      const s = item.slot;
      const dIdx = diasChaves.indexOf(s.dia);
      const diaClass = (dIdx % 2 === 0) ? 'dia-par' : 'dia-impar';
      const slotsDoDia = mapaDiasAtivos[s.dia]?.slots || [];
      const ehUltimoSlotDoDia = (slotsDoDia[slotsDoDia.length - 1] === item);
      const ehUltimoDia = (dIdx === diasChaves.length - 1);
      const bordaFim = (ehUltimoSlotDoDia && !ehUltimoDia) ? ' col-dia-fim' : '';

      const ehSlotDestaque = (sIdx === estadoTemporal.idxSlot);

      let classesSlot = `th-slot-header ${diaClass}${bordaFim}`;
      if (ehSlotDestaque) {
        classesSlot += ' col-slot-atual';
      }

      const rotuloSlot = s.label || s.textoInicio;
      const iconeSlot = ehSlotDestaque ? '⚡ ' : '';
      const titleAttr = ehSlotDestaque ? (estadoTemporal.textoTooltip || `${rotuloSlot} (Horário Atual / Próximo Horário)`) : rotuloSlot;

      theadHtml += `<th class="${classesSlot}" title="${titleAttr}">${iconeSlot}${rotuloSlot}</th>`;
    });
    theadHtml += '</tr>';

    document.getElementById('grade-cabecalho').innerHTML = theadHtml;

    // 6. Renderiza o Corpo da Tabela (TBODY)
    let tbodyHtml = '';

    salasVisiveis.forEach(itemSala => {
      const s = itemSala.sala;
      const rIdx = itemSala.rIdx;
      const r = rIdx;
      const linhaCels = matrizGrade[rIdx] || [];

      tbodyHtml += `<tr class="linha-grade-sala" data-idx="${r}" data-bloco="${s.bloco}">`;
      tbodyHtml += `<td class="col-fixa-sala" title="${s.nome}"><span class="txt-sala">${s.nome}</span></td>`;
      tbodyHtml += `<td class="col-fixa-cap">${s.capacidade}</td>`;

      let colIdxRelativo = 0;
      while (colIdxRelativo < slotsAtivos.length) {
        const itemSlot = slotsAtivos[colIdxRelativo];
        const cOrig = itemSlot.cIdx;
        const cel = linhaCels[cOrig];

        // Se a célula está coberta por um merge que iniciou em um slot anterior que TAMBÉM está visível, pula
        if (cel && cel.c) {
          // Verifica se a célula que deu origem ao merge está visível nos slotsAtivos
          let origemVisivel = false;
          for (let k = colIdxRelativo - 1; k >= 0; k--) {
            const prevColOrig = slotsAtivos[k].cIdx;
            const prevCel = linhaCels[prevColOrig];
            if (prevCel && !prevCel.c && prevCel.cs && (prevColOrig + prevCel.cs > cOrig)) {
              origemVisivel = true;
              break;
            }
          }
          if (origemVisivel) {
            colIdxRelativo++;
            continue;
          }
        }

        const celEfetiva = (cel && cel.t) ? cel : obterCelulaEfetiva(linhaCels, cOrig);
        const temAula = Boolean(celEfetiva && celEfetiva.t && celEfetiva.t.trim() !== '');

        // Calcula quantos slots visíveis consecutivos esta célula ocupa
        let colspanVisivel = 1;
        if (temAula && celEfetiva.cs && celEfetiva.cs > 1) {
          const colFimOrig = cOrig + celEfetiva.cs;
          for (let next = colIdxRelativo + 1; next < slotsAtivos.length; next++) {
            if (slotsAtivos[next].cIdx < colFimOrig) {
              colspanVisivel++;
            } else {
              break;
            }
          }
        }

        const csAttr = (colspanVisivel > 1) ? ` colspan="${colspanVisivel}"` : '';
        const bgStyle = (celEfetiva && celEfetiva.bg) ? ` style="background-color: ${celEfetiva.bg};"` : '';

        const temDisciplinas = Boolean(celEfetiva && celEfetiva.d && Array.isArray(celEfetiva.d) && celEfetiva.d.length > 0);
        let todasCarregadas = false;
        if (temDisciplinas) {
          todasCarregadas = celEfetiva.d.every(c => Boolean(obterCacheJupiter(c)));
        }

        let pendenteClass = '';
        if (temDisciplinas) {
          pendenteClass = todasCarregadas ? ' celula-carregada' : ' celula-aula-pendente';
        }

        const aulaClass = temAula
          ? (celEfetiva.pos ? ' celula-aula celula-pos' : ' celula-aula') + pendenteClass
          : ' celula-livre';

        let destaqueClass = '';
        if (temBusca && temAula && celulaCorrespondeABusca(celEfetiva, tokensBusca)) {
          destaqueClass = ' celula-destacada-busca';
        }

        let ativaModalClass = '';
        if (celulaAtivaInfo && String(celulaAtivaInfo.rIdx) === String(rIdx) && String(celulaAtivaInfo.cIdx) === String(itemSlot.cIdx)) {
          if (celulaAtivaInfo.expireAt === 0 || Date.now() < celulaAtivaInfo.expireAt) {
            ativaModalClass = ' celula-ativa-modal';
          }
        }

        const conteudo = temAula ? gerarConteudoCelula(celEfetiva) : '';

        const slotInfo = itemSlot.slot;
        const dIdx = diasChaves.indexOf(slotInfo.dia);
        const diaClass = (dIdx % 2 === 0) ? 'dia-par' : 'dia-impar';
        const slotsDoDia = mapaDiasAtivos[slotInfo.dia]?.slots || [];
        const ultimoSlotDoDia = slotsDoDia[slotsDoDia.length - 1];
        const slotFimCelula = slotsAtivos[colIdxRelativo + colspanVisivel - 1];
        const ehFimDoDia = (slotFimCelula === ultimoSlotDoDia) && (dIdx < diasChaves.length - 1);
        const bordaFim = ehFimDoDia ? ' col-dia-fim' : '';

        const codigosAttr = temDisciplinas ? ` data-codigos="${escapeHtml(celEfetiva.d.map(c => String(c).trim().toUpperCase()).join(','))}"` : '';

        tbodyHtml += `<td class="celula-grade ${diaClass}${bordaFim}${aulaClass}${destaqueClass}${ativaModalClass}" data-cidx="${itemSlot.cIdx}"${codigosAttr}${csAttr}${bgStyle}>${conteudo}</td>`;

        colIdxRelativo += colspanVisivel;
      }

      tbodyHtml += '</tr>';
    });

    document.getElementById('grade-corpo').innerHTML = tbodyHtml;

    if (celulaAtivaInfo && (celulaAtivaInfo.expireAt === 0 || Date.now() < celulaAtivaInfo.expireAt)) {
      celulaAtivaModal = document.querySelector(`tr[data-idx="${celulaAtivaInfo.rIdx}"] td[data-cidx="${celulaAtivaInfo.cIdx}"]`);
    } else {
      celulaAtivaModal = null;
    }

    // Enfileira disciplinas visíveis para enriquecimento progressivo em segundo plano
    extrairCodigosVisiveisEAgendar();
  }

  // ==========================================================================
  // MÓDULO DE ENRIQUECIMENTO PROGRESSIVO (BACKGROUND WORKER & CACHE)
  // Atende graduação (Jupiterweb) e pós-graduação (Janus) de forma unificada
  // ==========================================================================

  let jupiterTimerPausa = null;
  let jupiterTimerDebounceScroll = null;
  let timerEsconderProgressoDinamico = null;
  const PREFIXO_STORAGE_JUPITER = 'alocacao_jupiter_v19_';
  const PREFIXO_STORAGE_JANUS = 'alocacao_janus_v3_';

  function obterPrefixoStorage(cod) {
    return /^[A-Za-z]{3}[1-9]\d{3}$/i.test(cod) ? PREFIXO_STORAGE_JANUS : PREFIXO_STORAGE_JUPITER;
  }

  /**
   * Obtém a lista de todos os códigos de disciplinas presentes em toda a grade recebida.
   * Utiliza cache em memória para evitar varreduras desnecessárias da matriz.
   */
  function obterTodosCodigosGrade() {
    if (estadoApp._todosCodigosGrade && estadoApp._todosCodigosGrade.length > 0) {
      return estadoApp._todosCodigosGrade;
    }
    if (!estadoApp.dadosBrutos || !estadoApp.dadosBrutos.grade) return [];
    const setCodigos = new Set();
    const matrizGrade = estadoApp.dadosBrutos.grade || [];
    matrizGrade.forEach(linha => {
      if (!Array.isArray(linha)) return;
      linha.forEach(cel => {
        if (cel && cel.d && Array.isArray(cel.d)) {
          cel.d.forEach(cod => {
            const codNorm = String(cod).trim().toUpperCase();
            if (codNorm) setCodigos.add(codNorm);
          });
        }
      });
    });
    estadoApp._todosCodigosGrade = Array.from(setCodigos);
    return estadoApp._todosCodigosGrade;
  }

  /**
   * Atualiza a barra de progresso discreta do carregamento dinâmico em segundo plano (Jupiterweb/Janus)
   * na barra de resultados, centralizada na mesma linha de "Exibindo xx de xx salas",
   * com mensagem sem negrito e com itálico.
   */
  function atualizarProgressoCarregamentoDinamico() {
    const elProgresso = document.getElementById('status-carregamento-dinamico');
    const barraResultados = document.querySelector('.barra-resultados');
    if (!elProgresso) return;

    let elFill = document.getElementById('barra-progresso-dinamico-fill');
    if (!elFill) {
      elProgresso.innerHTML = '<span class="status-carregamento-texto"><i>Carregando dados do Jupiterweb/Janus</i></span>' +
        '<div class="progresso-dinamico-trilho">' +
        '<div id="barra-progresso-dinamico-fill" class="progresso-dinamico-barra" style="width: 0%;"></div>' +
        '</div>';
      elFill = document.getElementById('barra-progresso-dinamico-fill');
    }

    const todosCodigos = obterTodosCodigosGrade();
    const total = todosCodigos.length;

    // Se ainda não há dados ou não existem disciplinas na grade
    if (total === 0) {
      elProgresso.style.display = 'none';
      elProgresso.classList.remove('ocultando');
      if (elFill) elFill.style.width = '0%';
      if (barraResultados) barraResultados.classList.remove('carregando-dinamico');
      return;
    }

    // Calcula quantas disciplinas já estão no cache (memória ou sessionStorage)
    let concluidas = 0;
    for (let i = 0; i < total; i++) {
      if (obterCacheJupiter(todosCodigos[i])) {
        concluidas++;
      }
    }

    const emExecucao = (estadoApp.filaJupiter && estadoApp.filaJupiter.length > 0) || estadoApp.jupiterRequisicaoEmVoo;

    // Se já concluiu todas as disciplinas
    if (concluidas >= total) {
      if (emExecucao) {
        if (barraResultados) barraResultados.classList.add('carregando-dinamico');
        elProgresso.classList.remove('ocultando');
        elProgresso.style.display = 'inline-flex';
        if (elFill) elFill.style.width = '100%';
        elProgresso.title = 'Carregamento do Jupiterweb/Janus concluído (100%)';
        return;
      }

      // Se concluiu todas e a fila encerrou
      if (elProgresso.style.display !== 'none') {
        if (elFill) elFill.style.width = '100%';
        elProgresso.title = 'Carregamento do Jupiterweb/Janus concluído (100%)';
        if (timerEsconderProgressoDinamico) clearTimeout(timerEsconderProgressoDinamico);
        timerEsconderProgressoDinamico = setTimeout(() => {
          elProgresso.classList.add('ocultando');
          setTimeout(() => {
            elProgresso.style.display = 'none';
            elProgresso.classList.remove('ocultando');
            if (elFill) elFill.style.width = '0%';
            if (barraResultados) barraResultados.classList.remove('carregando-dinamico');
            timerEsconderProgressoDinamico = null;
          }, 350);
        }, 1000);
      } else {
        elProgresso.style.display = 'none';
        elProgresso.classList.remove('ocultando');
        if (elFill) elFill.style.width = '0%';
        if (barraResultados) barraResultados.classList.remove('carregando-dinamico');
      }
      return;
    }

    // Se a fila esvaziou sem requisição em voo (por exemplo, nenhum lote disparado ainda ou nada pendente)
    if (!emExecucao) {
      elProgresso.style.display = 'none';
      elProgresso.classList.remove('ocultando');
      if (elFill) elFill.style.width = '0%';
      if (barraResultados) barraResultados.classList.remove('carregando-dinamico');
      return;
    }

    // Carregamento dinâmico ativamente em execução
    if (timerEsconderProgressoDinamico) {
      clearTimeout(timerEsconderProgressoDinamico);
      timerEsconderProgressoDinamico = null;
    }

    const pct = Math.min(99, Math.floor((concluidas / total) * 100));
    if (barraResultados) barraResultados.classList.add('carregando-dinamico');
    elProgresso.classList.remove('ocultando');
    elProgresso.style.display = 'inline-flex';
    if (elFill) elFill.style.width = pct + '%';
    elProgresso.title = `Carregando dados do Jupiterweb/Janus: ${pct}%`;
  }

  // Limpeza de caches legados de versões anteriores no sessionStorage
  try {
    const chavesParaRemover = [];
    for (let i = 0; i < sessionStorage.length; i++) {
      const k = sessionStorage.key(i);
      if (k) {
        if (k.startsWith('alocacao_jupiter_') && !k.startsWith(PREFIXO_STORAGE_JUPITER)) {
          chavesParaRemover.push(k);
        } else if (k.startsWith('alocacao_janus_') && !k.startsWith(PREFIXO_STORAGE_JANUS)) {
          chavesParaRemover.push(k);
        }
      }
    }
    chavesParaRemover.forEach(k => sessionStorage.removeItem(k));
  } catch (e) {}

  /**
   * Obtém os dados de uma disciplina do cache de memória ou sessionStorage.
   * Retorna o objeto de dados ou null caso não esteja cacheado.
   */
  function obterCacheDisciplina(codigo) {
    if (!codigo) return null;
    const cod = String(codigo).trim().toUpperCase();
    if (estadoApp.cacheJupiter && estadoApp.cacheJupiter[cod]) {
      return estadoApp.cacheJupiter[cod];
    }
    try {
      const prefixo = obterPrefixoStorage(cod);
      const salvo = sessionStorage.getItem(prefixo + cod);
      if (salvo) {
        const parsed = JSON.parse(salvo);
        if (!estadoApp.cacheJupiter) estadoApp.cacheJupiter = {};
        estadoApp.cacheJupiter[cod] = parsed;
        return parsed;
      }
    } catch (e) {
      // sessionStorage indisponível ou bloqueado
    }
    return null;
  }

  function obterCacheJupiter(codigo) {
    return obterCacheDisciplina(codigo);
  }

  /**
   * Salva os dados de uma disciplina no cache de memória e no sessionStorage.
   */
  function salvarCacheDisciplina(codigo, dados) {
    if (!codigo || !dados) return;
    const cod = String(codigo).trim().toUpperCase();
    if (!estadoApp.cacheJupiter) estadoApp.cacheJupiter = {};
    estadoApp.cacheJupiter[cod] = dados;
    try {
      const prefixo = obterPrefixoStorage(cod);
      sessionStorage.setItem(prefixo + cod, JSON.stringify(dados));
    } catch (e) {
      // Quota excedida ou restrição do navegador
    }
  }

  function salvarCacheJupiter(codigo, dados) {
    salvarCacheDisciplina(codigo, dados);
  }

  /**
   * Limpa integralmente o cache de disciplinas (Jupiterweb e Janus) no navegador (memória RAM e sessionStorage),
   * cancela requisições pendentes e zera a fila de enriquecimento progressivo.
   */
  function limparCacheLocalDisciplinas() {
    estadoApp.cacheJupiter = {};
    estadoApp.filaJupiter = [];
    estadoApp.jupiterCallbacksUrgentes = {};
    estadoApp.jupiterContadorOrdem = 0;
    if (jupiterTimerPausa) {
      clearTimeout(jupiterTimerPausa);
      jupiterTimerPausa = null;
    }
    try {
      const chavesParaRemover = [];
      for (let i = 0; i < sessionStorage.length; i++) {
        const k = sessionStorage.key(i);
        if (k && (k.startsWith('alocacao_jupiter_') || k.startsWith('alocacao_janus_'))) {
          chavesParaRemover.push(k);
        }
      }
      chavesParaRemover.forEach(k => sessionStorage.removeItem(k));
    } catch (e) {
      console.warn('Erro ao limpar sessionStorage:', e);
    }
    if (typeof reindexarBuscaDaGradeAtual === 'function') {
      reindexarBuscaDaGradeAtual();
    }
    atualizarProgressoCarregamentoDinamico();
  }

  function limparCacheLocalJupiter() {
    limparCacheLocalDisciplinas();
  }

  /**
   * Enfileira um código na fila de enriquecimento progressivo.
   * Se já estiver na fila com prioridade menor, atualiza para a nova prioridade mais urgente.
   */
  function enfileirarJupiter(codigo, prioridade = 2) {
    if (!codigo) return false;
    const cod = String(codigo).trim().toUpperCase();
    if (!cod || obterCacheJupiter(cod)) return false;

    // Se já está no lote em voo, atualiza urgência se for Prioridade 0
    if (estadoApp.jupiterRequisicaoEmVoo && estadoApp.jupiterLoteEmVoo.indexOf(cod) !== -1) {
      return false;
    }

    // Se já está na fila
    const itemExistente = estadoApp.filaJupiter.find(item => item.codigo === cod);
    if (itemExistente) {
      if (prioridade < itemExistente.prioridade) {
        itemExistente.prioridade = prioridade;
        if (prioridade === 0) itemExistente.ordem = --estadoApp.jupiterContadorOrdem;
        reordenarFilaJupiter();
      }
      return true;
    }

    // Adiciona novo item na fila
    estadoApp.filaJupiter.push({
      codigo: cod,
      prioridade: prioridade,
      ordem: (prioridade === 0) ? --estadoApp.jupiterContadorOrdem : ++estadoApp.jupiterContadorOrdem
    });
    reordenarFilaJupiter();
    return true;
  }

  /**
   * Promove imediatamente uma disciplina para Prioridade 0 (urgente), acionada por clique do usuário.
   */
  function promoverUrgenteJupiter(codigo, callback) {
    if (!codigo) return;
    const cod = String(codigo).trim().toUpperCase();

    if (callback) {
      if (!estadoApp.jupiterCallbacksUrgentes[cod]) {
        estadoApp.jupiterCallbacksUrgentes[cod] = [];
      }
      estadoApp.jupiterCallbacksUrgentes[cod].push(callback);
    }

    const emCache = obterCacheJupiter(cod);
    if (emCache) {
      if (callback) {
        callback(emCache);
        const arr = estadoApp.jupiterCallbacksUrgentes[cod];
        if (arr) {
          const idx = arr.indexOf(callback);
          if (idx !== -1) arr.splice(idx, 1);
        }
      }
      return;
    }

    enfileirarJupiter(cod, 0);
    processarFilaJupiter();
  }

  /**
   * Reordena a fila: prioridade 0 (urgente) primeiro, depois 1 (visível na tela), depois 2 (oculto).
   * Para Prioridade 1: respeita rigorosamente a ordem visual no viewport (leitura natural).
   * Para Prioridade 2: respeita a ordem relativa de proximidade/extensão.
   * Para Prioridade 0 ou desempate geral: mantém FIFO.
   */
  function reordenarFilaJupiter() {
    estadoApp.filaJupiter.sort((a, b) => {
      if (a.prioridade !== b.prioridade) {
        return a.prioridade - b.prioridade;
      }
      if (a.prioridade === 1) {
        const posA = (a.posicaoVisual !== undefined) ? a.posicaoVisual : 99999;
        const posB = (b.posicaoVisual !== undefined) ? b.posicaoVisual : 99999;
        if (posA !== posB) return posA - posB;
      } else if (a.prioridade === 2) {
        const posA = (a.posicaoOculta !== undefined) ? a.posicaoOculta : 99999;
        const posB = (b.posicaoOculta !== undefined) ? b.posicaoOculta : 99999;
        if (posA !== posB) return posA - posB;
      }
      return a.ordem - b.ordem;
    });
  }

  /**
   * Reavalia prioridades da fila com base nos elementos estritamente visíveis no viewport 2D.
   * Prioridade 0 (urgente) é sempre preservada intacta.
   */
  function atualizarVisibilidadeFilaJupiter(codigosVisiveis, todosCodigos) {
    const mapaPosVisual = new Map();
    (codigosVisiveis || []).forEach(c => {
      if (c) {
        const cn = String(c).trim().toUpperCase();
        if (!mapaPosVisual.has(cn)) {
          mapaPosVisual.set(cn, mapaPosVisual.size);
        }
      }
    });

    const mapaPosOculta = new Map();
    const listaOcultos = [];
    (todosCodigos || []).forEach(c => {
      if (c) {
        const cn = String(c).trim().toUpperCase();
        if (!mapaPosVisual.has(cn) && !mapaPosOculta.has(cn)) {
          mapaPosOculta.set(cn, mapaPosOculta.size);
          listaOcultos.push(cn);
        }
      }
    });

    // 1. Atualiza prioridade e posições relativas dos itens já existentes na fila
    estadoApp.filaJupiter.forEach(item => {
      if (item.prioridade === 0) return; // Preserva urgente
      if (mapaPosVisual.has(item.codigo)) {
        item.prioridade = 1;
        item.posicaoVisual = mapaPosVisual.get(item.codigo);
      } else {
        item.prioridade = 2;
        item.posicaoOculta = mapaPosOculta.has(item.codigo) ? mapaPosOculta.get(item.codigo) : 99999;
      }
    });

    // 2. Adiciona novos códigos visíveis ainda não presentes (com Prioridade 1 e posição visual)
    mapaPosVisual.forEach((posVisual, cod) => {
      if (!obterCacheJupiter(cod) && !(estadoApp.jupiterRequisicaoEmVoo && estadoApp.jupiterLoteEmVoo.indexOf(cod) !== -1)) {
        if (!estadoApp.filaJupiter.some(item => item.codigo === cod)) {
          estadoApp.filaJupiter.push({
            codigo: cod,
            prioridade: 1,
            posicaoVisual: posVisual,
            ordem: ++estadoApp.jupiterContadorOrdem
          });
        }
      }
    });

    // 3. Adiciona demais códigos com Prioridade 2 (ocultos)
    listaOcultos.forEach(cod => {
      if (!obterCacheJupiter(cod) && !(estadoApp.jupiterRequisicaoEmVoo && estadoApp.jupiterLoteEmVoo.indexOf(cod) !== -1)) {
        if (!estadoApp.filaJupiter.some(item => item.codigo === cod)) {
          estadoApp.filaJupiter.push({
            codigo: cod,
            prioridade: 2,
            posicaoOculta: mapaPosOculta.get(cod),
            ordem: ++estadoApp.jupiterContadorOrdem
          });
        }
      }
    });

    reordenarFilaJupiter();
  }

  /**
   * Extrai códigos no Viewport 2D real (interseção das linhas e colunas visíveis na tela)
   * e agenda o enriquecimento progressivo garantindo que o usuário veja as células
   * à sua frente carregarem primeiro.
   */
  function extrairCodigosVisiveisEAgendar() {
    if (!estadoApp.dadosBrutos || !estadoApp.dadosBrutos.grade) return;

    const dados = estadoApp.dadosBrutos;
    const matrizGrade = dados.grade || [];
    const salasVisiveis = estadoApp._salasVisiveisAtuais || [];
    const slotsAtivos = estadoApp._slotsAtivosAtuais || [];

    if (salasVisiveis.length === 0 || slotsAtivos.length === 0) return;

    const containerGrade = document.getElementById('grade-tabela-container');
    const containerRect = (containerGrade && containerGrade.offsetWidth > 0 && containerGrade.offsetHeight > 0)
      ? containerGrade.getBoundingClientRect()
      : null;

    let salasNoViewport = [];
    let salasForaViewport = [];
    let slotsNoViewport = [];
    let slotsForaViewport = [];

    // 1. Identificação Vertical (Linhas/Salas no Viewport)
    if (containerGrade && containerRect) {
      const linhasTr = containerGrade.querySelectorAll('tr.linha-grade-sala');
      const setIdxSalasViewport = new Set();
      const margemY = 40;

      linhasTr.forEach(tr => {
        const rect = tr.getBoundingClientRect();
        if (rect.bottom >= (containerRect.top - margemY) && rect.top <= (containerRect.bottom + margemY)) {
          const idx = parseInt(tr.getAttribute('data-idx'), 10);
          if (!isNaN(idx)) setIdxSalasViewport.add(idx);
        }
      });

      if (setIdxSalasViewport.size > 0) {
        salasVisiveis.forEach(item => {
          if (setIdxSalasViewport.has(item.rIdx)) {
            salasNoViewport.push(item);
          } else {
            salasForaViewport.push(item);
          }
        });
      }
    }

    // Fallback vertical se a tabela ainda estiver em fase de layout
    if (salasNoViewport.length === 0) {
      salasNoViewport = salasVisiveis.slice(0, 8);
      salasForaViewport = salasVisiveis.slice(8);
    }

    // 2. Identificação Horizontal (Colunas/Slots no Viewport)
    if (containerGrade && containerRect) {
      const thSlots = containerGrade.querySelectorAll('thead th.th-slot-header');
      const setIdxSlotsViewport = new Set();
      const margemX = 40;

      thSlots.forEach((th, sIdx) => {
        const rect = th.getBoundingClientRect();
        if (rect.right >= (containerRect.left - margemX) && rect.left <= (containerRect.right + margemX)) {
          setIdxSlotsViewport.add(sIdx);
        }
      });

      if (setIdxSlotsViewport.size > 0) {
        slotsAtivos.forEach((item, sIdx) => {
          if (setIdxSlotsViewport.has(sIdx)) {
            slotsNoViewport.push(item);
          } else {
            slotsForaViewport.push(item);
          }
        });
      }
    }

    // Fallback horizontal se colunas ainda não foram pintadas
    if (slotsNoViewport.length === 0) {
      slotsNoViewport = slotsAtivos.slice(0, 8);
      slotsForaViewport = slotsAtivos.slice(8);
    }

    // 3. Montagem dos Códigos Prioridade 1 (Viewport 2D: Salas visíveis x Slots visíveis)
    // Varredura na ordem natural de leitura: linha a linha (topo para base), coluna a coluna (esq para dir)
    const codigosVisiveisSet = new Set();
    const codigosVisiveis = [];

    salasNoViewport.forEach(itemSala => {
      const linha = matrizGrade[itemSala.rIdx] || [];
      slotsNoViewport.forEach(itemSlot => {
        const cel = obterCelulaEfetiva(linha, itemSlot.cIdx);
        if (cel && cel.d && Array.isArray(cel.d)) {
          cel.d.forEach(cod => {
            const codNorm = String(cod).trim().toUpperCase();
            if (codNorm && !codigosVisiveisSet.has(codNorm)) {
              codigosVisiveisSet.add(codNorm);
              codigosVisiveis.push(codNorm);
            }
          });
        }
      });
    });

    // 4. Montagem dos Demais Códigos (Prioridade 2):
    // 4a. Slots horizontais fora do viewport para as salas que estão na tela
    const todosCodigosSet = new Set(codigosVisiveisSet);
    const todosCodigos = [...codigosVisiveis];

    salasNoViewport.forEach(itemSala => {
      const linha = matrizGrade[itemSala.rIdx] || [];
      slotsForaViewport.forEach(itemSlot => {
        const cel = obterCelulaEfetiva(linha, itemSlot.cIdx);
        if (cel && cel.d && Array.isArray(cel.d)) {
          cel.d.forEach(cod => {
            const codNorm = String(cod).trim().toUpperCase();
            if (codNorm && !todosCodigosSet.has(codNorm)) {
              todosCodigosSet.add(codNorm);
              todosCodigos.push(codNorm);
            }
          });
        }
      });
    });

    // 4b. Salas abaixo da rolagem vertical
    salasForaViewport.forEach(itemSala => {
      const linha = matrizGrade[itemSala.rIdx] || [];
      slotsAtivos.forEach(itemSlot => {
        const cel = obterCelulaEfetiva(linha, itemSlot.cIdx);
        if (cel && cel.d && Array.isArray(cel.d)) {
          cel.d.forEach(cod => {
            const codNorm = String(cod).trim().toUpperCase();
            if (codNorm && !todosCodigosSet.has(codNorm)) {
              todosCodigosSet.add(codNorm);
              todosCodigos.push(codNorm);
            }
          });
        }
      });
    });

    // 4c. Salas filtradas fora da grade
    matrizGrade.forEach(linha => {
      if (!Array.isArray(linha)) return;
      linha.forEach(cel => {
        if (cel && cel.d && Array.isArray(cel.d)) {
          cel.d.forEach(cod => {
            const codNorm = String(cod).trim().toUpperCase();
            if (codNorm && !todosCodigosSet.has(codNorm)) {
              todosCodigosSet.add(codNorm);
              todosCodigos.push(codNorm);
            }
          });
        }
      });
    });

    estadoApp._todosCodigosGrade = todosCodigos;
    atualizarVisibilidadeFilaJupiter(codigosVisiveis, todosCodigos);
    processarFilaJupiter();
    atualizarProgressoCarregamentoDinamico();
  }

  /**
   * Loop do Background Worker: despacha requisições em lote de até 3 códigos por vez.
   * Garante ESTRITAMENTE no máximo 1 lote em trânsito simultâneo.
   */
  function processarFilaJupiter() {
    if (estadoApp.jupiterRequisicaoEmVoo) return;
    if (!estadoApp.filaJupiter || estadoApp.filaJupiter.length === 0) {
      atualizarProgressoCarregamentoDinamico();
      return;
    }

    // Descarta do topo códigos que já estejam no cache
    while (estadoApp.filaJupiter.length > 0 && obterCacheJupiter(estadoApp.filaJupiter[0].codigo)) {
      estadoApp.filaJupiter.shift();
    }

    if (estadoApp.filaJupiter.length === 0) {
      atualizarProgressoCarregamentoDinamico();
      return;
    }

    const TAMANHO_LOTE = 3;
    const loteItens = [];
    const codigosLote = [];

    while (estadoApp.filaJupiter.length > 0 && loteItens.length < TAMANHO_LOTE) {
      const item = estadoApp.filaJupiter.shift();
      if (!obterCacheJupiter(item.codigo) && codigosLote.indexOf(item.codigo) === -1) {
        loteItens.push(item);
        codigosLote.push(item.codigo);
      }
    }

    if (codigosLote.length === 0) {
      processarFilaJupiter();
      return;
    }

    estadoApp.jupiterRequisicaoEmVoo = true;
    estadoApp.jupiterLoteEmVoo = codigosLote;
    atualizarProgressoCarregamentoDinamico();

    // Se estiver em ambiente de teste local sem google.script.run
    if (typeof google === 'undefined' || !google.script || !google.script.run) {
      setTimeout(() => {
        concluirLoteJupiter({});
      }, 500);
      return;
    }

    google.script.run
      .withSuccessHandler(function(resposta) {
        concluirLoteJupiter(resposta && resposta.sucesso && resposta.dados ? resposta.dados : {});
      })
      .withFailureHandler(function(erro) {
        console.warn('[Disciplinas Worker] Falha ao consultar lote:', codigosLote, erro);
        falharLoteJupiter(codigosLote);
      })
      .obterLoteDisciplinas(codigosLote);
  }

  /**
   * Processa o retorno com sucesso de um lote do backend.
   */
  function concluirLoteJupiter(dadosRecebidos) {
    const lote = estadoApp.jupiterLoteEmVoo || [];
    estadoApp.jupiterRequisicaoEmVoo = false;
    estadoApp.jupiterLoteEmVoo = [];

    lote.forEach(cod => {
      const dados = dadosRecebidos ? dadosRecebidos[cod] : null;
      if (dados) {
        salvarCacheJupiter(cod, dados);
      } else {
        salvarCacheJupiter(cod, { semOferecimento: true, turmas: [] });
      }

      // Executa eventuais callbacks de clique urgente
      if (estadoApp.jupiterCallbacksUrgentes[cod]) {
        const callbacks = estadoApp.jupiterCallbacksUrgentes[cod];
        delete estadoApp.jupiterCallbacksUrgentes[cod];
        callbacks.forEach(cb => {
          try { cb(obterCacheJupiter(cod)); } catch (e) { console.error(e); }
        });
      }
    });

    // Atualiza links visíveis no DOM
    atualizarEnriquecimentoCelulasVisiveis(lote);

    // Indexa dinamicamente quaisquer novos docentes e disciplinas recebidos no lote
    if (dadosRecebidos) {
      if (typeof indexarDocentesDeDadosDisciplina === 'function') {
        Object.keys(dadosRecebidos).forEach(cod => {
          indexarDocentesDeDadosDisciplina(cod, dadosRecebidos[cod]);
        });
      }
      if (typeof indexarDisciplina === 'function') {
        Object.keys(dadosRecebidos).forEach(cod => {
          const item = dadosRecebidos[cod];
          if (item && item.nome) {
            indexarDisciplina(cod, item.nome);
          }
        });
      }
      const inpBusca = document.getElementById('input-busca-sala');
      if (inpBusca && document.activeElement === inpBusca && typeof atualizarSugestoesBusca === 'function') {
        atualizarSugestoesBusca(inpBusca.value);
      }
    }

    // Se houver busca ativa, reaplica os filtros para atualizar salas e destaques imediatamente
    if (estadoApp.buscaSala && estadoApp.buscaSala.trim()) {
      aplicarFiltrosEAtualizarVisualizacao();
    }

    atualizarProgressoCarregamentoDinamico();

    // Pausa de alívio de 250ms antes de disparar o próximo lote
    if (jupiterTimerPausa) clearTimeout(jupiterTimerPausa);
    jupiterTimerPausa = setTimeout(processarFilaJupiter, 250);
  }

  /**
   * Trata falha na requisição do lote, re-enfileirando os itens para não haver perda.
   */
  function falharLoteJupiter(codigosLote) {
    estadoApp.jupiterRequisicaoEmVoo = false;
    estadoApp.jupiterLoteEmVoo = [];

    (codigosLote || []).forEach(cod => {
      if (estadoApp.jupiterCallbacksUrgentes[cod]) {
        const callbacks = estadoApp.jupiterCallbacksUrgentes[cod];
        delete estadoApp.jupiterCallbacksUrgentes[cod];
        callbacks.forEach(cb => {
          try { cb(null, 'Falha de comunicação com o servidor ao consultar dados do Jupiterweb.'); } catch (e) { console.error(e); }
        });
      }

      // Re-enfileira no final com Prioridade 2
      if (!obterCacheJupiter(cod)) {
        enfileirarJupiter(cod, 2);
      }
    });

    atualizarProgressoCarregamentoDinamico();

    // Pausa preventiva de 3s antes de retomar
    if (jupiterTimerPausa) clearTimeout(jupiterTimerPausa);
    jupiterTimerPausa = setTimeout(processarFilaJupiter, 3000);
  }

  /**
   * Extrai o nome do(s) docente(s) para formatação do tooltip no hover.
   * Ex: "Docente: Carlos Dias Maciel", "Docentes: Carlos Dias, Marcelo Becker", "Docente: A designar".
   */
  function extrairDocentesParaTooltip(dados, turmasSolicitadas, ehPos = false) {
    if (!dados) return '';
    if (dados.semOferecimento) {
      const sistema = (ehPos || dados.nivel === 'pos') ? 'Janus' : 'Jupiterweb';
      return `Sem oferecimento ativo no ${sistema}`;
    }

    const turmasObj = dados.turmas || {};
    const chavesTurmas = Object.keys(turmasObj);
    if (chavesTurmas.length === 0) {
      return 'Docente: A designar';
    }

    const docentesSet = new Set();

    if (turmasSolicitadas && turmasSolicitadas.length > 0) {
      turmasSolicitadas.forEach(tSol => {
        const tNorm = String(tSol).padStart(2, '0');
        let tMatch = turmasObj[tNorm] || turmasObj[String(parseInt(tNorm, 10))];
        if (!tMatch) {
          for (let i = 0; i < chavesTurmas.length; i++) {
            const k = chavesTurmas[i];
            const v = turmasObj[k];
            if (v && (String(v.numero).padStart(2, '0') === tNorm || String(v.codigoTurma || '').endsWith(tNorm))) {
              tMatch = v;
              break;
            }
          }
        }
        if (tMatch && tMatch.docentes) {
          tMatch.docentes.forEach(d => {
            if (d && d !== 'A Designar' && d !== '-') docentesSet.add(d);
          });
        }
      });
    }

    // Se nenhuma turma específica casou ou turmas solicitadas estavam vazias, usa a primeira turma
    if (docentesSet.size === 0) {
      const primeira = turmasObj[chavesTurmas[0]];
      if (primeira && primeira.docentes) {
        primeira.docentes.forEach(d => {
          if (d && d !== 'A Designar' && d !== '-') docentesSet.add(d);
        });
      }
    }

    if (docentesSet.size === 0) {
      return 'Docente: A designar';
    } else if (docentesSet.size === 1) {
      return 'Docente: ' + Array.from(docentesSet)[0];
    } else {
      return 'Docentes: ' + Array.from(docentesSet).sort().join(', ');
    }
  }

  /**
   * Constrói o HTML interno de uma célula da grade de forma reativa,
   * injetando data-codigo, data-turma, classe enriquecida e tooltip com docente.
   */
  function gerarConteudoCelula(celEfetiva) {
    if (!celEfetiva || !celEfetiva.t) return '';
    let html = celEfetiva.h || escapeHtml(celEfetiva.t);
    if (!celEfetiva.d || !Array.isArray(celEfetiva.d)) {
      return html;
    }

    const turmasArr = celEfetiva.turmas || [];
    const turmasStr = turmasArr.join(',');

    celEfetiva.d.forEach(codRaw => {
      const cod = String(codRaw).trim().toUpperCase();
      const dados = obterCacheJupiter(cod);
      const ehPos = Boolean(celEfetiva.pos || (dados && dados.nivel === 'pos') || /^[A-Za-z]{3}5\d{3}$/i.test(cod));

      let novoTitle = null;
      let classeExtra = '';

      if (dados) {
        classeExtra = ' link-disc-enriquecido';
        if (dados.semOferecimento) {
          const sistema = ehPos ? 'Janus' : 'Jupiterweb';
          novoTitle = `${cod} • Sem oferecimento ativo no ${sistema} (clique para ver detalhes)`;
        } else {
          const docente = extrairDocentesParaTooltip(dados, turmasArr, ehPos);
          novoTitle = docente;
        }
      }

      // Procura por tag <a contendo o código da disciplina
      const padraoLink = new RegExp(`(<a\\s+[^>]*href=["'][^"']*${cod}[^"']*["'][^>]*>)([\\s\\S]*?<\\/a>)`, 'gi');
      html = html.replace(padraoLink, (match, tagAbertura, resto) => {
        let novaTag = tagAbertura;
        if (!novaTag.includes('data-codigo=')) {
          novaTag = novaTag.replace(/<a\b/i, `<a data-codigo="${cod}" data-turma="${escapeHtml(turmasStr)}" tabindex="0" role="button"`);
        } else if (turmasStr && !novaTag.includes('data-turma=')) {
          novaTag = novaTag.replace(/<a\b/i, `<a data-turma="${escapeHtml(turmasStr)}"`);
        }
        if (classeExtra && !novaTag.includes('link-disc-enriquecido')) {
          novaTag = novaTag.replace(/class=["']([^"']*)["']/i, `class="$1${classeExtra}"`);
        }
        if (novoTitle) {
          novaTag = novaTag.replace(/title=["'][^"']*["']/i, `title="${escapeHtml(novoTitle)}"`);
        }
        return novaTag + resto;
      });
    });

    return html;
  }

  /**
   * Atualiza tooltips e classes dos links correspondentes aos códigos enriquecidos no DOM.
   */
  function atualizarEnriquecimentoCelulasVisiveis(codigosAtualizados) {
    if (!codigosAtualizados || codigosAtualizados.length === 0) return;
    const containerGrade = document.getElementById('grade-corpo');
    if (!containerGrade) return;

    codigosAtualizados.forEach(cod => {
      let links = containerGrade.querySelectorAll(`a.link-disc[data-codigo="${cod}"]`);
      if (links.length === 0) {
        links = containerGrade.querySelectorAll(`a.link-disc[href*="${cod}"]`);
      }
      const dados = obterCacheJupiter(cod);
      if (dados && links.length > 0) {
        const ehPos = Boolean((dados && dados.nivel === 'pos') || /^[A-Za-z]{3}5\d{3}$/i.test(cod));
        links.forEach(link => {
          if (!link.getAttribute('data-codigo')) {
            link.setAttribute('data-codigo', cod);
          }
          link.classList.add('link-disc-enriquecido');
          const turmaRaw = link.getAttribute('data-turma') || '';
          const turmasArr = turmaRaw ? turmaRaw.split(',') : [];

          if (dados.semOferecimento) {
            const sistema = ehPos ? 'Janus' : 'Jupiterweb';
            link.title = `${cod} • Sem oferecimento ativo no ${sistema} (clique para ver detalhes)`;
          } else {
            const docente = extrairDocentesParaTooltip(dados, turmasArr, ehPos);
            link.title = docente;
          }
        });
      }
    });

    // Atualiza as células (TDs) que agora tiveram todas as suas disciplinas carregadas
    const tdsPendentes = containerGrade.querySelectorAll('td.celula-aula-pendente[data-codigos]');
    tdsPendentes.forEach(td => {
      const codigosRaw = td.getAttribute('data-codigos') || '';
      const codigosArr = codigosRaw.split(',').map(s => s.trim().toUpperCase()).filter(Boolean);
      if (codigosArr.length > 0) {
        const todasProntas = codigosArr.every(c => Boolean(obterCacheJupiter(c)));
        if (todasProntas) {
          td.classList.remove('celula-aula-pendente');
          td.classList.add('celula-carregada');
          td.classList.add('celula-recem-carregada');
          setTimeout(() => {
            td.classList.remove('celula-recem-carregada');
          }, 600);
        }
      }
    });
  }

  /**
   * Configura delegação de eventos de clique no corpo da grade para abrir o modal.
   * Preserva Ctrl+Clique, Cmd+Clique, Shift+Clique e botão do meio para nova aba.
   */
  function configurarDelegacaoEventosGrade() {
    const corpo = document.getElementById('grade-corpo');
    if (!corpo) return;

    corpo.addEventListener('click', function(e) {
      const link = e.target.closest('a.link-disc');
      if (!link) return;

      // Preserva abertura em nova aba se o usuário usou teclas modificadoras ou botão do meio
      if (e.ctrlKey || e.metaKey || e.shiftKey || e.altKey || (e.button !== undefined && e.button !== 0)) {
        return;
      }

      let codigo = link.getAttribute('data-codigo');
      if (!codigo) {
        const href = link.getAttribute('href') || link.href || '';
        const matchHref = href.match(/(?:sgldis|coddis)=([A-Za-z0-9]+)/i);
        if (matchHref) {
          codigo = matchHref[1].toUpperCase();
        } else {
          const matchTxt = (link.textContent || '').match(/\b([A-Za-z]{3}\d{3,4}|\d{7})\b/);
          if (matchTxt) codigo = matchTxt[1].toUpperCase();
        }
      }

      if (!codigo) return;

      // Abre o Card Modal Elegante (se dados já carregados, exibe direto;
      // se ainda pendente, abre com skeleton e promove para Prioridade 0 urgente na fila)
      e.preventDefault();

      let turmaRaw = link.getAttribute('data-turma') || '';
      if (!turmaRaw) {
        const td = link.closest('td');
        if (td) {
          const matchT = (td.textContent || '').match(/\bT(\d{1,2})\b/gi);
          if (matchT) turmaRaw = matchT.map(t => t.replace(/T/i, '')).join(',');
        }
      }
      const turmas = turmaRaw ? turmaRaw.split(',').filter(Boolean) : [];

      abrirCardDisciplina(codigo, turmas, link);
    });

    // Suporte a ativação via teclado (Enter / Espaço)
    corpo.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' || e.key === ' ') {
        const link = e.target.closest('a.link-disc');
        if (link) {
          let codigo = link.getAttribute('data-codigo');
          if (!codigo) {
            const href = link.getAttribute('href') || link.href || '';
            const matchHref = href.match(/(?:sgldis|coddis)=([A-Za-z0-9]+)/i);
            if (matchHref) codigo = matchHref[1].toUpperCase();
            else {
              const matchTxt = (link.textContent || '').match(/\b([A-Za-z]{3}\d{3,4}|\d{7})\b/);
              if (matchTxt) codigo = matchTxt[1].toUpperCase();
            }
          }
          if (codigo) {
            e.preventDefault();
            let turmaRaw = link.getAttribute('data-turma') || '';
            if (!turmaRaw) {
              const td = link.closest('td');
              if (td) {
                const matchT = (td.textContent || '').match(/\bT(\d{1,2})\b/gi);
                if (matchT) turmaRaw = matchT.map(t => t.replace(/T/i, '')).join(',');
              }
            }
            const turmas = turmaRaw ? turmaRaw.split(',').filter(Boolean) : [];
            abrirCardDisciplina(codigo, turmas, link);
          }
        }
      }
    });
  }

  /**
   * Configura eventos de fechamento do modal (backdrop e teclado Esc).
   */
  function configurarEventosModalDisciplina() {
    const modal = document.getElementById('modal-card-disciplina');
    if (modal) {
      modal.addEventListener('click', function(e) {
        if (e.target === modal) {
          fecharCardDisciplina();
        }
      });

    // Tecla Escape para acessibilidade
    window.addEventListener('keydown', function(e) {

        const modal = document.getElementById('modal-card-disciplina');
        if (modal && modal.classList.contains('aberto')) {
          fecharCardDisciplina();
        }
      }
    });
  }

  let ultimoElementoFocado = null;
  let celulaAtivaModal = null;
  let celulaAtivaInfo = null;
  let timerDestaqueCelulaModal = null;
  let codigoAtivoModal = null;
  let dadosAtivosModal = null;
  let turmaAtivaModalNum = null;
  let turmaAtivaModalObj = null;
  let celulaDisparadoraModal = null;

  /**
   * Abre o Card Modal Elegante para exibição de detalhes completos da disciplina.
   */
  function abrirCardDisciplina(codigo, turmasSolicitadas, elementoDisparador) {
    if (!codigo) return;
    const cod = String(codigo).trim().toUpperCase();
    codigoAtivoModal = cod;
    dadosAtivosModal = null;
    turmaAtivaModalNum = null;
    turmaAtivaModalObj = null;
    celulaDisparadoraModal = null;

    ultimoElementoFocado = elementoDisparador || document.activeElement;

    // Cancela contagem regressiva anterior e limpa destaque da célula prévia, se houver
    if (timerDestaqueCelulaModal) {
      clearTimeout(timerDestaqueCelulaModal);
      timerDestaqueCelulaModal = null;
    }
    const celNoDom = document.querySelector('.celula-ativa-modal');
    if (celNoDom) {
      celNoDom.classList.remove('celula-ativa-modal');
    }
    if (celulaAtivaModal) {
      celulaAtivaModal.classList.remove('celula-ativa-modal');
      celulaAtivaModal = null;
    }
    celulaAtivaInfo = null;

    // Destaca a célula clicada com os tons amarelos de Hoje/Agora
    const disparador = elementoDisparador || document.activeElement;
    if (disparador) {
      const td = disparador.closest('td.celula-grade') || disparador.closest('td');
      if (td) {
        td.classList.add('celula-ativa-modal');
        celulaAtivaModal = td;
        const tr = td.closest('tr');
        const rIdx = tr ? parseInt(tr.getAttribute('data-idx'), 10) : null;
        const cIdxAttr = td.getAttribute('data-cidx');
        const cIdx = (cIdxAttr !== null && cIdxAttr !== '') ? parseInt(cIdxAttr, 10) : null;
        celulaAtivaInfo = {
          rIdx: rIdx,
          cIdx: cIdx,
          expireAt: 0 // 0 indica que o modal está aberto
        };

        // Extrai metadados completos da célula disparadora para a pesquisa de troca de sala
        if (estadoApp.dadosBrutos && rIdx !== null && !isNaN(rIdx) && cIdx !== null && !isNaN(cIdx)) {
          const dadosB = estadoApp.dadosBrutos;
          const slots = dadosB.slots || [];
          const salas = dadosB.salas || [];
          const grade = dadosB.grade || [];
          const linha = grade[rIdx] || [];
          const celEfetiva = (linha[cIdx] && linha[cIdx].t) ? linha[cIdx] : obterCelulaEfetiva(linha, cIdx);
          const csReal = (celEfetiva && celEfetiva.cs) ? celEfetiva.cs : 1;
          const slotIni = slots[cIdx];
          const endIdx = Math.min(cIdx + csReal - 1, slots.length - 1);
          const slotFim = slots[endIdx];
          const salaObj = salas[rIdx];

          celulaDisparadoraModal = {
            rIdx: rIdx,
            cIdx: cIdx,
            cs: csReal,
            dia: slotIni ? slotIni.dia : null,
            horaInicioMin: slotIni ? slotIni.horaInicioMin : null,
            horaFimMin: slotFim ? slotFim.horaFimMin : null,

            textoFim: slotFim ? (slotFim.textoFim || slotFim.label) : '',
            nomeSala: salaObj ? salaObj.nome : ''
          };

  /**
   * Preenche a interface do modal com os dados estruturados recebidos.
   */
  function exibirDadosModal(codigo, dados, turmasSolicitadas) {
    dadosAtivosModal = dados;
    const elSkeleton = document.getElementById('modal-card-skeleton');
    if (elSkeleton) elSkeleton.style.display = 'none';

    const elNome = document.getElementById('modal-disc-nome');
    if (elNome) elNome.textContent = dados.nome || codigo;

    const elSemOferecimento = document.getElementById('modal-card-sem-oferecimento');
    const elDados = document.getElementById('modal-card-dados');

    const ehPos = (dados.sistema === 'janus') || /^[A-Za-z]{3}[1-9]\d{3}$/.test(codigo);
    const sistemaNome = ehPos ? 'Janus' : 'Jupiterweb';

    const elSemOfTexto = document.getElementById('modal-sem-oferecimento-texto');
    if (elSemOfTexto) {
      elSemOfTexto.textContent = 'Esta disciplina não possui turmas ativas cadastradas no ' + sistemaNome + ' para o período letivo vigente.';
    }

    // Atualiza link externo: se for Janus e houver apenas 1 turma, aponta direto para a turma
    const elLinkExt = document.getElementById('modal-btn-link-jupiter');
    if (elLinkExt) {
      if (ehPos) {
        const turmasKeys = (dados && dados.turmas) ? Object.keys(dados.turmas) : [];
        if (turmasKeys.length === 1) {
          const unica = dados.turmas[turmasKeys[0]];
          const ofeNum = unica.ofe || parseInt(unica.numero || turmasKeys[0], 10);
          elLinkExt.href = 'https://uspdigital.usp.br/janus/publico/turma/' + encodeURIComponent(codigo) + '/' + encodeURIComponent(ofeNum);
        } else {
          elLinkExt.href = 'https://uspdigital.usp.br/janus/DisciplinaAux?tipo=T&sgldis=' + encodeURIComponent(codigo);
        }
        elLinkExt.textContent = 'Abrir no Janus ↗';
      } else {
        elLinkExt.href = 'https://uspdigital.usp.br/jupiterweb/obterTurma?sgldis=' + encodeURIComponent(codigo);
        elLinkExt.textContent = 'Abrir no Jupiterweb ↗';
      }
    }

    if (dados.semOferecimento || !dados.turmas || Object.keys(dados.turmas).length === 0) {
      if (elSemOferecimento) elSemOferecimento.style.display = 'block';
      if (elDados) elDados.style.display = 'none';
      return;
    }

    if (elSemOferecimento) elSemOferecimento.style.display = 'none';
    if (elDados) elDados.style.display = 'block';

    const turmasObj = dados.turmas;
    const listaChaves = Object.keys(turmasObj).sort();
    const elSeletor = document.getElementById('modal-seletor-turmas');

    if (elSeletor) {
      let htmlPills = '';
      listaChaves.forEach(chave => {
        const t = turmasObj[chave];
        const rotulo = 'T' + (t.numero || chave);
        htmlPills += `<button type="button" class="btn-pill-turma" data-turma-num="${escapeHtml(chave)}" role="tab" aria-selected="false">${escapeHtml(rotulo)}</button>`;
      });
      elSeletor.innerHTML = htmlPills;

      // Evento de clique nas pills
      elSeletor.querySelectorAll('.btn-pill-turma').forEach(btn => {
        btn.addEventListener('click', function() {
          const num = this.getAttribute('data-turma-num');
          selecionarTurmaNoModal(dados, num);
        });
      });
    }

    // Determina a turma a ser pré-selecionada
    let turmaInicial = listaChaves[0];
    if (turmasSolicitadas && turmasSolicitadas.length > 0) {
      for (let i = 0; i < turmasSolicitadas.length; i++) {
        const tSol = String(turmasSolicitadas[i]).padStart(2, '0');
        if (turmasObj[tSol]) {
          turmaInicial = tSol;
          break;
        }
        const matchKey = listaChaves.find(k => {
          const item = turmasObj[k];
          return String(item.numero).padStart(2, '0') === tSol || String(item.codigoTurma || '').endsWith(tSol);
        });
        if (matchKey) {
          turmaInicial = matchKey;
          break;
        }
      }
    }

    selecionarTurmaNoModal(dados, turmaInicial);
  }

  /**
   * Converte string de hora 'HH:MM' para minutos desde 00:00 (ex: '08:00' -> 480).
   */
  function horaTextoParaMinutos(str) {
    if (!str) return null;
    const m = String(str).trim().match(/^(\d{1,2}):(\d{2})$/);
    if (!m) return null;
    return parseInt(m[1], 10) * 60 + parseInt(m[2], 10);
  }

  /**
   * Normaliza formatos diversos de dia da semana para chave canônica ('seg', 'ter', 'qua', 'qui', 'sex', 'sab').
   */
  function normalizarDiaSemanaJS(diaStr) {
    if (!diaStr) return null;
    const s = normalizarTexto(diaStr);
    if (/\b(seg|segunda|2a|2ª)\b/.test(s)) return 'seg';
    if (/\b(ter|terca|3a|3ª)\b/.test(s)) return 'ter';
    if (/\b(qua|quarta|4a|4ª)\b/.test(s)) return 'qua';
    if (/\b(qui|quinta|5a|5ª)\b/.test(s)) return 'qui';
    if (/\b(sex|sexta|6a|6ª)\b/.test(s)) return 'sex';
    if (/\b(sab|sabado)\b/.test(s)) return 'sab';
    return null;
  }

  /**
   * Executa a pesquisa inteligente de troca de sala a partir do card modal.
   * Fecha o modal, extrai a demanda e horário da aula, aplica os filtros de salas livres
   * e rola a tela até a grade com feedback informativo.
   */
  function executarPesquisaTrocaDeSala() {
    const dados = dadosAtivosModal;
    const turmaObj = turmaAtivaModalObj;
    const celulaInfo = celulaDisparadoraModal;
    const cod = codigoAtivoModal || (dados ? dados.codigo : '');

    const ehPos = (dados && dados.sistema === 'janus') || /^[A-Za-z]{3}[1-9]\d{3}$/.test(cod || '');

    // 1. Extração de Demanda (Matriculados ou Vagas)
    let demanda = 0;
    let demandaInformada = false;

    if (turmaObj) {
      if (ehPos) {
        if (turmaObj.vagas !== undefined && turmaObj.vagas !== null) {
          const v = parseInt(turmaObj.vagas, 10);
          if (!isNaN(v) && v >= 0) {
            demanda = v;
            demandaInformada = true;
          }
        }
      } else {
        if (turmaObj.matriculados !== undefined && turmaObj.matriculados !== null) {
          const m = parseInt(turmaObj.matriculados, 10);
          if (!isNaN(m) && m >= 0) {
            demanda = m;
            demandaInformada = true;
          }
        }
      }
    }

    // 2. Resolução de Dia e Intervalo de Horário (minutos)
    let diaAlvo = null;
    let horaInicioMin = null;
    let horaFimMin = null;
    let textoHorario = '';
    let nomeSalaOrigem = celulaInfo ? (celulaInfo.nomeSala || '') : '';

    const horariosTurma = (turmaObj && turmaObj.horarios) ? turmaObj.horarios : [];

    if (celulaInfo && celulaInfo.dia && celulaInfo.horaInicioMin !== null && celulaInfo.horaFimMin !== null) {
      // Prioridade 1: Verifica se a turma ativa possui horários cadastrados
      if (horariosTurma.length > 0) {
        // Procura se a turma ativa tem aula no MESMO dia da célula clicada
        const horarioMesmoDia = horariosTurma.find(h => normalizarDiaSemanaJS(h.dia) === celulaInfo.dia);
        if (horarioMesmoDia) {
          diaAlvo = celulaInfo.dia;
          horaInicioMin = celulaInfo.horaInicioMin;
          horaFimMin = celulaInfo.horaFimMin;
          textoHorario = (celulaInfo.textoInicio && celulaInfo.textoFim)
            ? `${celulaInfo.textoInicio} às ${celulaInfo.textoFim}`
            : `${minParaTexto(horaInicioMin)} às ${minParaTexto(horaFimMin)}`;
        } else {
          // Turma ativa sem aula no dia da célula original (usuário alternou de aba para turma diferente)
          const primeiro = horariosTurma[0];
          diaAlvo = normalizarDiaSemanaJS(primeiro.dia);
          const hIni = horaTextoParaMinutos(primeiro.inicio);
          const hFim = horaTextoParaMinutos(primeiro.fim);
          if (diaAlvo && hIni !== null && hFim !== null) {
            horaInicioMin = hIni;
            horaFimMin = hFim;
            textoHorario = `${primeiro.inicio} às ${primeiro.fim}`;
          }
        }
      } else {
        // Turma sem horários oficiais estruturados (ou dados ainda em carregamento): usa dados da célula da grade
        diaAlvo = celulaInfo.dia;
        horaInicioMin = celulaInfo.horaInicioMin;
        horaFimMin = celulaInfo.horaFimMin;
        textoHorario = (celulaInfo.textoInicio && celulaInfo.textoFim)
          ? `${celulaInfo.textoInicio} às ${celulaInfo.textoFim}`
          : `${minParaTexto(horaInicioMin)} às ${minParaTexto(horaFimMin)}`;
      }
    } else if (horariosTurma.length > 0) {
      // Modal aberto sem contexto de célula
      const primeiro = horariosTurma[0];
      diaAlvo = normalizarDiaSemanaJS(primeiro.dia);
      const hIni = horaTextoParaMinutos(primeiro.inicio);
      const hFim = horaTextoParaMinutos(primeiro.fim);
      if (diaAlvo && hIni !== null && hFim !== null) {
        horaInicioMin = hIni;
        horaFimMin = hFim;
        textoHorario = `${primeiro.inicio} às ${primeiro.fim}`;
      }
    }

    // Se nenhum dia ou horário pôde ser determinado
    if (!diaAlvo || horaInicioMin === null || horaFimMin === null) {
      exibirToast(
        'Troca de Sala Indisponível',
        'Não foi possível identificar o dia e horário desta disciplina para busca de salas livres.',
        'info'
      );
      fecharCardDisciplina();
      return;
    }

    // 3. Fecha o modal de forma limpa (desassocia ultimoElementoFocado para evitar foco em célula removida)
    ultimoElementoFocado = null;
    fecharCardDisciplina();

    // 4. Limpeza silenciosa de busca textual (sem re-renderização prematura e sem roubo de foco)
    limparBuscaSilenciosa();

    // 5. Configuração atômica do estadoApp
    estadoApp.blocosSelecionados.clear();
    estadoApp.blocosSelecionados.add('todos');

    estadoApp.salasSelecionadas.clear();
    estadoApp.salasSelecionadas.add('todas');

    estadoApp.diasSelecionados.clear();
    estadoApp.diasSelecionados.add(diaAlvo);

    estadoApp.horaInicioMin = horaInicioMin;
    estadoApp.horaFimMin = horaFimMin;
    estadoApp.capacidadeMin = demanda;
    estadoApp.apenasLivres = true;

    // 6. Sincronização rigorosa dos Controles Visuais
    // Chips de Dias
    document.querySelectorAll('#container-dias .chip').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.dia === diaAlvo);
    });

    // Chips de Blocos
    document.querySelectorAll('#container-blocos .chip').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.bloco === 'todos');
    });
    const badgeBlocos = document.getElementById('badge-blocos-resumo');
    if (badgeBlocos) badgeBlocos.textContent = 'Todos';

    // Chips de Salas
    document.querySelectorAll('#container-salas .chip').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.sala === 'todas');
    });
    const badgeSalas = document.getElementById('badge-salas-resumo');
    if (badgeSalas) badgeSalas.textContent = 'Todas';

    // Dropdowns de Horário
    const selIni = document.getElementById('sel-hora-inicio');
    const selFim = document.getElementById('sel-hora-fim');
    if (selIni && estadoApp.horariosInicioDisponiveis && estadoApp.horariosInicioDisponiveis.length > 0) {
      const iniProx = encontrarMinutoMaisProximo(estadoApp.horariosInicioDisponiveis, horaInicioMin);
      if (iniProx !== null) {
        selIni.value = iniProx;
        estadoApp.horaInicioMin = iniProx;
      }
    }
    if (selFim && estadoApp.horariosFimDisponiveis && estadoApp.horariosFimDisponiveis.length > 0) {
      const optsValidasFim = (estadoApp.horaInicioMin !== null)
        ? estadoApp.horariosFimDisponiveis.filter(o => o.min > estadoApp.horaInicioMin)
        : estadoApp.horariosFimDisponiveis;
      const fimProx = encontrarMinutoMaisProximo(optsValidasFim, horaFimMin);
      if (fimProx !== null) {
        selFim.value = fimProx;
        estadoApp.horaFimMin = fimProx;
      }
    }
    atualizarOpcoesDropdownsHorarios('ambos');
    atualizarEstiloValidacaoHorarios();

    // Input de Capacidade e Badge
    const inpCap = document.getElementById('input-capacidade-min');
    if (inpCap) inpCap.value = demanda > 0 ? demanda : '';
    document.querySelectorAll('.chips-atalhos-cap .chip-sm').forEach(btn => {
      btn.classList.toggle('active', btn.id === `chip-cap-${demanda}`);
    });
    const badgeCap = document.getElementById('badge-capacidade-resumo');
    if (badgeCap) {
      badgeCap.textContent = demanda > 0 ? (demanda === 1 ? '1 lugar' : `${demanda}+ lugares`) : 'Todas';
    }

    // Botão Modo Livres
    const btnLivres = document.getElementById('btn-modo-livres');
    if (btnLivres) {
      btnLivres.classList.add('ativo');
      btnLivres.disabled = false;
      btnLivres.title = '';
    }

    // 7. Disparo da filtragem unificada (renderização única)
    aplicarFiltrosEAtualizarVisualizacao();

    // 8. Scroll Suave e Acessibilidade
    const secaoGrade = document.querySelector('.grade-section') || document.getElementById('grade-tabela-container');
    if (secaoGrade) {
      secaoGrade.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    // 9. Feedback Toast Contextualizado
    const mapaNomesDias = {
      seg: 'Segunda-feira',
      ter: 'Terça-feira',
      qua: 'Quarta-feira',
      qui: 'Quinta-feira',
      sex: 'Sexta-feira',
      sab: 'Sábado'
    };
    const nomeDiaExtenso = mapaNomesDias[diaAlvo] || diaAlvo;
    const rotuloCap = demanda > 0
      ? (ehPos ? `vagas ≥ ${demanda}` : `alunos ≥ ${demanda}`)
      : 'todas capacidades';

    const infoOrigem = nomeSalaOrigem ? ` para substituir ${nomeSalaOrigem}` : '';
    let msgToast = `Exibindo salas livres${infoOrigem} (${rotuloCap}) em ${nomeDiaExtenso} (${textoHorario}).`;
    if (!demandaInformada) {
      msgToast = `Demanda não informada. Exibindo todas as salas livres${infoOrigem} em ${nomeDiaExtenso} (${textoHorario}).`;
    }

    exibirToast('Pesquisa de Troca de Sala ⇄', msgToast, 'sucesso', 5000);
  }

  /**
   * Monitora rolagem na tabela para re-priorizar células visíveis com debounce.
   */
  function iniciarMonitoramentoScrollGrade() {
    const containerGrade = document.getElementById('grade-tabela-container');
    if (!containerGrade) return;

    containerGrade.addEventListener('scroll', function() {
      if (jupiterTimerDebounceScroll) clearTimeout(jupiterTimerDebounceScroll);
      jupiterTimerDebounceScroll = setTimeout(() => {
        extrairCodigosVisiveisEAgendar();
      }, 150);
    }, { passive: true });
  }
</script>
