<script>
  /**
   * ScriptJs.html - Lógica Frontend do Alocação Plus Web App
   * Executado diretamente no navegador de cada usuário.
   */

  // Estado Global dos Filtros no Navegador do Usuário
  const estadoApp = {
    carregando: true,
    dadosBrutos: null,       // Matriz e metadados recebidos do Backend
    diasSelecionados: new Set(['todos']),
    blocosSelecionados: new Set(['todos']),
    salasSelecionadas: new Set(['todas']),
    horaInicioMin: null,     // em minutos a partir de 00:00 (ex: 480 = 08:00)
    horaFimMin: null,        // em minutos a partir de 00:00 (ex: 600 = 10:00)
    capacidadeMin: 0,
    apenasLivres: false,
    buscaSala: '',
    focarColunasMatch: true,
    horariosInicioDisponiveis: [],
    horariosFimDisponiveis: [],
    // --- Enriquecimento Progressivo Jupiterweb ---
    cacheJupiter: {},
    filaJupiter: [],
    jupiterRequisicaoEmVoo: false,
    jupiterLoteEmVoo: [],
    jupiterCallbacksUrgentes: {},
    jupiterContadorOrdem: 0,
    _todosCodigosGrade: null,
    _salasVisiveisAtuais: [],
    _slotsAtivosAtuais: []
  };

  const MAPA_DIAS_SEMANA = {
    0: { chave: 'seg', label: 'Segunda-feira (Hoje é Domingo)' },
    1: { chave: 'seg', label: 'Segunda-feira' },
    2: { chave: 'ter', label: 'Terça-feira' },
    3: { chave: 'qua', label: 'Quarta-feira' },
    4: { chave: 'qui', label: 'Quinta-feira' },
    5: { chave: 'sex', label: 'Sexta-feira' },
    6: { chave: 'sab', label: 'Sábado' }
  };

  const TODOS_OS_DIAS = ['seg', 'ter', 'qua', 'qui', 'sex', 'sab'];

  // --------------------------------------------------------------------------
  // Inicialização ao carregar a página
  // --------------------------------------------------------------------------
  window.addEventListener('DOMContentLoaded', function() {
    configurarIndicadorHoje();
    iniciarMonitoramentoHorarioAtual();
    iniciarMonitoramentoScrollGrade();
    configurarDelegacaoEventosGrade();
    configurarEventosModalDisciplina();
    configurarAutocompleteBusca();
    carregarDadosDoBackend();

    // Registra métrica de acesso em segundo plano (assíncrono e silencioso)
    setTimeout(registrarAcessoSilencioso, 1500);
  });

  let timerAtualizacaoSlot = null;
  function iniciarMonitoramentoHorarioAtual() {
    if (timerAtualizacaoSlot) clearInterval(timerAtualizacaoSlot);
    timerAtualizacaoSlot = setInterval(() => {
      // Re-renderiza a grade periodicamente para manter o destaque do horário atual sincronizado com o relógio
      if (estadoApp.dadosBrutos) {
        renderizarGrade();
      }
    }, 60000);
  }

  function configurarIndicadorHoje() {
    const diaNum = new Date().getDay();
    const infoHoje = MAPA_DIAS_SEMANA[diaNum] || MAPA_DIAS_SEMANA[1];
    const lblHoje = document.getElementById('label-hoje-info');
    if (lblHoje) {
      lblHoje.textContent = infoHoje.label;
    }
  }

  // --------------------------------------------------------------------------
  // Comunicação com o Backend via google.script.run
  // --------------------------------------------------------------------------
  function carregarDadosDoBackend(forcarAtualizacao = false) {
    if (!estadoApp.dadosBrutos) {
      exibirCarregando(true);
    }

    if (typeof google === 'undefined' || !google.script || !google.script.run) {
      console.warn('Ambiente de desenvolvimento local detectado (sem google.script.run).');
      exibirErroCarregamento('Ambiente fora do Google Apps Script. Publique como Web App para carregar os dados.');
      return;
    }

    google.script.run
      .withSuccessHandler(aoReceberDadosGradeSucesso)
      .withFailureHandler(aoFalharCarregamentoGrade)
      .obterDadosGradeWeb(forcarAtualizacao);
  }

  // --------------------------------------------------------------------------
  // Telemetria e Estatísticas de Acesso (Nativo, Silencioso e Anônimo)
  // --------------------------------------------------------------------------
  function obterIdAnonimoUsuario() {
    const CHAVE_ID = 'alocacao_plus_uid';
    let uid = null;
    try {
      uid = localStorage.getItem(CHAVE_ID);
      if (!uid) {
        uid = 'usr_' + Math.random().toString(36).substring(2, 8) + Date.now().toString(36);
        localStorage.setItem(CHAVE_ID, uid);
      }
    } catch (e) {
      uid = 'anon_' + Math.random().toString(36).substring(2, 8);
    }
    return uid;
  }

  function classificarTipoVisita() {
    const CHAVE_ULTIMA_DATA = 'alocacao_plus_ult_data';
    const hojeStr = new Date().toISOString().split('T')[0];
    let tipo = 'Primeiro Acesso';

    try {
      const ultData = localStorage.getItem(CHAVE_ULTIMA_DATA);
      if (!ultData) {
        tipo = 'Primeiro Acesso';
      } else if (ultData !== hojeStr) {
        tipo = 'Nova Visita Hoje';
      } else {
        tipo = 'Recorrente';
      }
      localStorage.setItem(CHAVE_ULTIMA_DATA, hojeStr);
    } catch (e) {
      tipo = 'Visita';
    }
    return tipo;
  }

  function detectarDispositivo() {
    const isMobile = window.innerWidth <= 768 || /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
    return isMobile ? 'Mobile' : 'Desktop';
  }

  function registrarAcessoSilencioso() {
    try {
      // Executa apenas quando implantado no Google Apps Script
      if (typeof google === 'undefined' || !google.script || !google.script.run) {
        return;
      }

      // Evita duplicação por reloads rápidos (limite de 1 ping a cada 15 min por sessão/aba)
      const CHAVE_SESSAO = 'alocacao_plus_ping_sessao';
      const agoraMs = Date.now();
      const ultimoPing = sessionStorage.getItem(CHAVE_SESSAO);
      if (ultimoPing && (agoraMs - parseInt(ultimoPing, 10) < 15 * 60 * 1000)) {
        return;
      }
      sessionStorage.setItem(CHAVE_SESSAO, String(agoraMs));

      const payload = {
        idAnonimo: obterIdAnonimoUsuario(),
        tipoVisita: classificarTipoVisita(),
        dispositivo: detectarDispositivo(),
        resolucao: (window.screen ? `${window.screen.width}x${window.screen.height}` : `${window.innerWidth}x${window.innerHeight}`)
      };

      google.script.run
        .withSuccessHandler(function() {})
        .withFailureHandler(function() {})
        .registrarAcessoWeb(payload);
    } catch (e) {
      // Silencioso para jamais impactar a experiência de consulta do usuário
    }
  }

  function solicitarRecarregarDados() {
    const btn = document.getElementById('btn-recarregar-dados');
    if (btn) {
      btn.textContent = '⏳ Sincronizando...';
      btn.disabled = true;
      btn.style.opacity = '0.7';
    }

    // Exibe o estado de carregamento com spinner idêntico à abertura inicial
    exibirCarregando(true);
    const txtContador = document.getElementById('txt-contador-resultados');
    if (txtContador) {
      txtContador.textContent = 'Conectando à grade oficial do SVGRAD...';
    }

    // Limpa o cache do Júpiter no cliente (memória RAM e sessionStorage)
    if (typeof limparCacheLocalJupiter === 'function') {
      limparCacheLocalJupiter();
    }

    carregarDadosDoBackend(true);
  }

  function aoReceberDadosGradeSucesso(resposta) {
    try {
      const btn = document.getElementById('btn-recarregar-dados');
      if (btn) {
        btn.textContent = '🔄 Atualizar Dados';
        btn.disabled = false;
        btn.style.opacity = '1';
      }

      if (!resposta || !resposta.sucesso) {
        const msgErro = resposta ? resposta.msg : 'Resposta vazia do servidor.';
        exibirErroCarregamento(msgErro);
        exibirToast('Falha na Sincronização', msgErro, 'erro');
        return;
      }

      const eraRecarregamentoManual = (estadoApp.dadosBrutos !== null);
      estadoApp.dadosBrutos = resposta.dados;
      estadoApp._todosCodigosGrade = null;
      estadoApp.carregando = false;

      // Atualiza label de sincronização
      const lblSync = document.getElementById('txt-ultima-sincronizacao');
      if (lblSync && resposta.dados.timestamp) {
        lblSync.textContent = 'Sincronizado: ' + resposta.dados.timestamp;
      }

      // Inicializa controles baseados nos dados recebidos
      inicializarControlesComDados(resposta.dados);

      // Renderiza a grade completa
      renderizarGrade();

      // Reindexa a busca exclusivamente a partir da grade recém-carregada e do cache local
      if (typeof reindexarBuscaDaGradeAtual === 'function') {
        reindexarBuscaDaGradeAtual();
      }

      // Se foi uma solicitação manual, exibe a notificação Toast de sucesso
      if (eraRecarregamentoManual) {
        exibirToast(
          'Sincronização Concluída',
          `Grade oficial do SVGRAD e dados do Jupiterweb sincronizados (${resposta.dados.timestamp}).`,
          'sucesso'
        );
      }
    } catch (err) {
      console.error('Erro ao processar dados da grade:', err);
    } finally {
      exibirCarregando(false);
    }
  }

  function aoFalharCarregamentoGrade(erro) {
    const btn = document.getElementById('btn-recarregar-dados');
    if (btn) {
      btn.textContent = '🔄 Atualizar Dados';
      btn.disabled = false;
      btn.style.opacity = '1';
    }
    const msg = erro.message || 'Erro de comunicação com o servidor Google Apps Script.';
    exibirToast('Erro de Conexão', msg, 'erro');
    if (!estadoApp.dadosBrutos) {
      exibirErroCarregamento(msg);
    } else {
      exibirCarregando(false);
      renderizarGrade();
    }
  }

  // --------------------------------------------------------------------------
  // Notificações Toast do Sistema
  // --------------------------------------------------------------------------
  function exibirToast(titulo, mensagem, tipo = 'sucesso', duracaoMs = 4000) {
    const container = document.getElementById('toast-container');
    if (!container) return;

    const icones = {
      sucesso: '✅',
      erro: '❌',
      info: 'ℹ️'
    };

    const toast = document.createElement('div');
    toast.className = `toast toast-${tipo}`;
    toast.innerHTML = `
      <span class="toast-icone">${icones[tipo] || 'ℹ️'}</span>
      <div class="toast-corpo">
        <div class="toast-titulo">${titulo}</div>
        <div class="toast-mensagem">${mensagem}</div>
      </div>
      <button type="button" class="toast-fechar" aria-label="Fechar">&times;</button>
    `;

    const fecharBtn = toast.querySelector('.toast-fechar');
    const removerToast = () => {
      toast.classList.remove('show');
      setTimeout(() => {
        if (toast.parentNode) toast.parentNode.removeChild(toast);
      }, 260);
    };

    fecharBtn.onclick = (e) => {
      e.stopPropagation();
      removerToast();
    };

    toast.onclick = removerToast;

    container.appendChild(toast);

    // Anima a entrada suave
    requestAnimationFrame(() => {
      toast.classList.add('show');
    });

    if (duracaoMs > 0) {
      setTimeout(() => {
        removerToast();
      }, duracaoMs);
    }
  }

  function exibirCarregando(mostrar) {
    const elLoad = document.getElementById('estado-carregamento');
    const elTab = document.getElementById('grade-tabela-container');
    const elVazio = document.getElementById('estado-vazio');

    if (mostrar) {
      if (elLoad) elLoad.style.display = 'flex';
      if (elTab) elTab.style.display = 'none';
      if (elVazio) elVazio.style.display = 'none';
    } else {
      if (elLoad) elLoad.style.display = 'none';
    }
  }

  function exibirErroCarregamento(mensagem) {
    exibirCarregando(false);
    const elVazio = document.getElementById('estado-vazio');
    const elTab = document.getElementById('grade-tabela-container');
    if (elTab) elTab.style.display = 'none';
    if (elVazio) {
      elVazio.style.display = 'flex';
      elVazio.querySelector('h3').textContent = 'Erro ao carregar os dados';
      elVazio.querySelector('p').textContent = mensagem;
    }
  }

  // --------------------------------------------------------------------------
  // Inicialização de Filtros Dinâmicos (Blocos, Horários e Capacidade)
  // --------------------------------------------------------------------------
  function inicializarControlesComDados(dados) {
    // 1. Popula Blocos Dinâmicos
    popularChipsBlocos(dados.blocos || []);

    // 2. Popula Dropdowns de Horários
    popularSelectsHorarios(dados.estruturaHorarios || {});

    // 3. Ajusta limite de capacidade
    configurarLimiteCapacidade(dados.salas || []);
  }

  function popularChipsBlocos(blocos) {
    const container = document.getElementById('container-blocos');
    if (!container) return;

    // Mantém o chip "Todos os Blocos" e insere os novos
    container.innerHTML = '<button type="button" class="chip active" data-bloco="todos" onclick="alternarBloco(\'todos\')">Todos os Blocos</button>';

    blocos.forEach(b => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'chip';
      btn.dataset.bloco = b;
      btn.textContent = b;
      btn.onclick = () => alternarBloco(b);
      container.appendChild(btn);
    });
  }

  function atualizarChipsSalas(salasElegiveis) {
    const container = document.getElementById('container-salas');
    const badge = document.getElementById('badge-salas-resumo');
    if (!container) return;

    // Preserva rolagem caso o usuário esteja navegando na lista de chips
    const scrollAnterior = container.scrollTop;

    // Extrai lista única de nomes de salas elegíveis pelos outros filtros
    const nomesElegiveis = [...new Set(salasElegiveis.map(item => item.sala.nome).filter(Boolean))];

    // Valida seleção atual contra as salas elegíveis (remove salas que não atendem mais aos outros filtros)
    if (!estadoApp.salasSelecionadas.has('todas')) {
      for (const s of estadoApp.salasSelecionadas) {
        if (!nomesElegiveis.includes(s)) {
          estadoApp.salasSelecionadas.delete(s);
        }
      }
      if (estadoApp.salasSelecionadas.size === 0 || estadoApp.salasSelecionadas.size === nomesElegiveis.length) {
        estadoApp.salasSelecionadas.clear();
        estadoApp.salasSelecionadas.add('todas');
      }
    }

    // Atualiza badge de contagem
    if (badge) {
      if (nomesElegiveis.length === 0) {
        badge.textContent = '0 disponíveis';
      } else if (estadoApp.salasSelecionadas.has('todas')) {
        badge.textContent = `Todas (${nomesElegiveis.length})`;
      } else {
        badge.textContent = `${estadoApp.salasSelecionadas.size} de ${nomesElegiveis.length}`;
      }
    }

    // Limpa container e recria os chips apenas com as salas elegíveis
    container.innerHTML = '';

    const todasAtivo = estadoApp.salasSelecionadas.has('todas');
    const btnTodas = document.createElement('button');
    btnTodas.type = 'button';
    btnTodas.className = 'chip' + (todasAtivo ? ' active' : '');
    btnTodas.dataset.sala = 'todas';
    btnTodas.textContent = 'Todas as Salas';
    btnTodas.onclick = () => alternarSala('todas');
    container.appendChild(btnTodas);

    if (nomesElegiveis.length === 0) {
      const spanVazio = document.createElement('span');
      spanVazio.style.cssText = 'font-size: 11px; color: #94a3b8; padding: 4px 6px; font-style: italic;';
      spanVazio.textContent = 'Nenhuma sala com os filtros acima';
      container.appendChild(spanVazio);
    } else {
      nomesElegiveis.forEach(nome => {
        const btn = document.createElement('button');
        btn.type = 'button';
        const ativo = !todasAtivo && estadoApp.salasSelecionadas.has(nome);
        btn.className = 'chip' + (ativo ? ' active' : '');
        btn.dataset.sala = nome;
        btn.textContent = nome;
        btn.onclick = () => alternarSala(nome);
        container.appendChild(btn);
      });
    }

    container.scrollTop = scrollAnterior;
  }

  function popularSelectsHorarios(estrutura) {
    const selIni = document.getElementById('sel-hora-inicio');
    const selFim = document.getElementById('sel-hora-fim');
    if (!selIni || !selFim || !estrutura.listaSlots) return;

    const mapaIni = {};
    const mapaFim = {};

    estrutura.listaSlots.forEach(s => {
      if (s.horaInicioMin !== null && !mapaIni[s.horaInicioMin]) {
        mapaIni[s.horaInicioMin] = s.textoInicio || s.label;
      }
      if (s.horaFimMin !== null && !mapaFim[s.horaFimMin]) {
        mapaFim[s.horaFimMin] = s.textoFim || s.label;
      }
    });

    estadoApp.horariosInicioDisponiveis = Object.keys(mapaIni).map(Number).sort((a,b) => a - b).map(min => ({
      min: min,
      label: mapaIni[min]
    }));

    estadoApp.horariosFimDisponiveis = Object.keys(mapaFim).map(Number).sort((a,b) => a - b).map(min => ({
      min: min,
      label: mapaFim[min]
    }));

    atualizarOpcoesDropdownsHorarios('ambos');
  }

  function atualizarOpcoesDropdownsHorarios(origem) {
    const selIni = document.getElementById('sel-hora-inicio');
    const selFim = document.getElementById('sel-hora-fim');
    if (!selIni || !selFim) return;

    const valIni = selIni.value;
    const valFim = selFim.value;

    if (origem === 'inicio' || origem === 'ambos') {
      selIni.innerHTML = '<option value="todos">Todos os horários</option>';
      (estadoApp.horariosInicioDisponiveis || []).forEach(o => {
        const opt = document.createElement('option');
        opt.value = o.min;
        opt.textContent = o.label;
        selIni.appendChild(opt);
      });
      if (valIni !== 'todos' && selIni.querySelector(`option[value="${valIni}"]`)) {
        selIni.value = valIni;
      }
    }

    if (origem === 'fim' || origem === 'ambos') {
      selFim.innerHTML = '<option value="todos">Todos os horários</option>';
      (estadoApp.horariosFimDisponiveis || []).forEach(o => {
        const opt = document.createElement('option');
        opt.value = o.min;
        opt.textContent = o.label;
        selFim.appendChild(opt);
      });
      if (valFim !== 'todos' && selFim.querySelector(`option[value="${valFim}"]`)) {
        selFim.value = valFim;
      }
    }

    atualizarEstiloValidacaoHorarios();
  }

  function atualizarEstiloValidacaoHorarios() {
    const selIni = document.getElementById('sel-hora-inicio');
    const selFim = document.getElementById('sel-hora-fim');
    if (!selIni || !selFim) return;

    const valIni = selIni.value;
    const valFim = selFim.value;

    // Se ambos tiverem horários específicos selecionados e início >= término
    const ehInvalido = (valIni !== 'todos' && valFim !== 'todos' && parseInt(valIni, 10) >= parseInt(valFim, 10));

    selIni.classList.toggle('select-invalido', ehInvalido);
    selFim.classList.toggle('select-invalido', ehInvalido);
  }

  function configurarLimiteCapacidade(salas) {
    let maxCap = 0;
    salas.forEach(s => {
      const c = parseInt(String(s.capacidade).replace(/\D/g, ''), 10) || 0;
      if (c > maxCap) maxCap = c;
    });
    if (maxCap === 0) maxCap = 100;

    const inp = document.getElementById('input-capacidade-min');
    if (inp) {
      inp.max = maxCap;
      inp.placeholder = `Ex: 40 (máx: ${maxCap})`;
    }
  }

  // --------------------------------------------------------------------------
  // Interações de Filtros
  // --------------------------------------------------------------------------
  function alternarDia(dia) {
    if (dia === 'todos') {
      estadoApp.diasSelecionados.clear();
      estadoApp.diasSelecionados.add('todos');
    } else {
      estadoApp.diasSelecionados.delete('todos');
      if (estadoApp.diasSelecionados.has(dia)) {
        estadoApp.diasSelecionados.delete(dia);
      } else {
        estadoApp.diasSelecionados.add(dia);
      }

      if (estadoApp.diasSelecionados.size === 0 || estadoApp.diasSelecionados.size === TODOS_OS_DIAS.length) {
        estadoApp.diasSelecionados.clear();
        estadoApp.diasSelecionados.add('todos');
      }
    }

    // Atualiza visual dos chips
    document.querySelectorAll('#container-dias .chip').forEach(btn => {
      const d = btn.dataset.dia;
      if (estadoApp.diasSelecionados.has(d)) {
        btn.classList.add('active');
      } else {
        btn.classList.remove('active');
      }
    });

    aplicarFiltrosEAtualizarVisualizacao();
  }

  function selecionarHoje() {
    const diaNum = new Date().getDay();
    const infoHoje = MAPA_DIAS_SEMANA[diaNum] || MAPA_DIAS_SEMANA[1];
    estadoApp.diasSelecionados.clear();
    estadoApp.diasSelecionados.add(infoHoje.chave);

    document.querySelectorAll('#container-dias .chip').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.dia === infoHoje.chave);
    });

    aplicarFiltrosEAtualizarVisualizacao();
  }

  function alternarBloco(bloco) {
    if (bloco === 'todos') {
      estadoApp.blocosSelecionados.clear();
      estadoApp.blocosSelecionados.add('todos');
    } else {
      estadoApp.blocosSelecionados.delete('todos');
      if (estadoApp.blocosSelecionados.has(bloco)) {
        estadoApp.blocosSelecionados.delete(bloco);
      } else {
        estadoApp.blocosSelecionados.add(bloco);
      }

      const totalBlocos = (estadoApp.dadosBrutos && estadoApp.dadosBrutos.blocos) ? estadoApp.dadosBrutos.blocos.length : 0;
      if (estadoApp.blocosSelecionados.size === 0 || estadoApp.blocosSelecionados.size === totalBlocos) {
        estadoApp.blocosSelecionados.clear();
        estadoApp.blocosSelecionados.add('todos');
      }
    }

    // Atualiza visual
    document.querySelectorAll('#container-blocos .chip').forEach(btn => {
      const b = btn.dataset.bloco;
      btn.classList.toggle('active', estadoApp.blocosSelecionados.has(b));
    });

    const badge = document.getElementById('badge-blocos-resumo');
    if (badge) {
      badge.textContent = estadoApp.blocosSelecionados.has('todos')
        ? 'Todos'
        : `${estadoApp.blocosSelecionados.size} selecionado(s)`;
    }

    aplicarFiltrosEAtualizarVisualizacao();
  }

  function alternarSala(sala) {
    if (sala === 'todas') {
      estadoApp.salasSelecionadas.clear();
      estadoApp.salasSelecionadas.add('todas');
    } else {
      estadoApp.salasSelecionadas.delete('todas');
      if (estadoApp.salasSelecionadas.has(sala)) {
        estadoApp.salasSelecionadas.delete(sala);
      } else {
        estadoApp.salasSelecionadas.add(sala);
      }

      if (estadoApp.salasSelecionadas.size === 0) {
        estadoApp.salasSelecionadas.clear();
        estadoApp.salasSelecionadas.add('todas');
      }
    }

    aplicarFiltrosEAtualizarVisualizacao();
  }

  function aoAlterarHorario(isInicio) {
    const valIni = document.getElementById('sel-hora-inicio').value;
    const valFim = document.getElementById('sel-hora-fim').value;

    estadoApp.horaInicioMin = (valIni !== 'todos') ? parseInt(valIni, 10) : null;

  }

  function encontrarMinutoMaisProximo(lista, alvoMin) {
    if (!lista || lista.length === 0) return null;
    let melhor = lista[0].min;
    let menorDiff = Math.abs(melhor - alvoMin);

    for (let i = 1; i < lista.length; i++) {
      const val = lista[i].min;
      const diff = Math.abs(val - alvoMin);
      if (diff < menorDiff) {
        melhor = val;
        menorDiff = diff;
      }
    }
    return melhor;
  }

  function selecionarHorarioAgora() {
    // 1. Ativa o dia da semana correspondente para hoje
    const diaNum = new Date().getDay();
    const infoHoje = MAPA_DIAS_SEMANA[diaNum] || MAPA_DIAS_SEMANA[1];
    estadoApp.diasSelecionados.clear();
    estadoApp.diasSelecionados.add(infoHoje.chave);

    document.querySelectorAll('#container-dias .chip').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.dia === infoHoje.chave);
    });

    // 2. Determina o bloco de aula mais adequado à hora atual
    const agora = new Date();
    const minutosAgora = agora.getHours() * 60 + agora.getMinutes();

    // Blocos de aula padrão mais frequentes na EESC / USP
    const BLOCOS_AULA_EESC = [
      { inicio: 8 * 60, fim: 10 * 60 },           // 08:00 - 10:00
      { inicio: 10 * 60 + 20, fim: 12 * 60 },      // 10:20 - 12:00
      { inicio: 14 * 60 + 20, fim: 16 * 60 + 10 }, // 14:20 - 16:10
      { inicio: 16 * 60 + 20, fim: 18 * 60 },      // 16:20 - 18:00
      { inicio: 19 * 60, fim: 20 * 60 + 40 },      // 19:00 - 20:40
      { inicio: 20 * 60 + 50, fim: 22 * 60 + 30 }  // 20:50 - 22:30
    ];

    // Procura se estamos dentro de algum bloco neste momento
    let blocoAlvo = BLOCOS_AULA_EESC.find(b => minutosAgora >= b.inicio && minutosAgora < b.fim);

    // Se estiver em intervalo entre aulas ou antes da 1ª aula matutina, foca no próximo bloco
    if (!blocoAlvo) {
      blocoAlvo = BLOCOS_AULA_EESC.find(b => b.inicio > minutosAgora);
    }

    // Se for tarde da noite (após último bloco), foca no último bloco do dia
    if (!blocoAlvo) {
      blocoAlvo = BLOCOS_AULA_EESC[BLOCOS_AULA_EESC.length - 1];
    }

    // 3. Ajusta o select de Início (sel-hora-inicio)
    const selIni = document.getElementById('sel-hora-inicio');
    const selFim = document.getElementById('sel-hora-fim');

    if (selIni && estadoApp.horariosInicioDisponiveis.length > 0) {
      const iniMaisProximo = encontrarMinutoMaisProximo(estadoApp.horariosInicioDisponiveis, blocoAlvo.inicio);
      if (iniMaisProximo !== null) {
        selIni.value = iniMaisProximo;
        estadoApp.horaInicioMin = iniMaisProximo;
      }
    }

    // 4. Ajusta o select de Término (sel-hora-fim) delimitando o intervalo do bloco
    if (selFim && estadoApp.horariosFimDisponiveis.length > 0) {
      const optsValidasFim = (estadoApp.horaInicioMin !== null)
        ? estadoApp.horariosFimDisponiveis.filter(o => o.min > estadoApp.horaInicioMin)
        : estadoApp.horariosFimDisponiveis;

      const fimMaisProximo = encontrarMinutoMaisProximo(optsValidasFim, blocoAlvo.fim);
      if (fimMaisProximo !== null) {
        selFim.value = fimMaisProximo;
        estadoApp.horaFimMin = fimMaisProximo;
      }
    }

    atualizarEstiloValidacaoHorarios();

    // 5. Aplica a visualização atualizada
    aplicarFiltrosEAtualizarVisualizacao();
  }

  // --------------------------------------------------------------------------
  // Normalização e Busca Inteligente (Disciplinas, Docentes, Texto e Salas)
  // --------------------------------------------------------------------------
  function normalizarTexto(txt) {
    if (!txt) return '';
    return String(txt)
      .toLowerCase()
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '');
  }

  function escapeHtml(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  function obterCelulaEfetiva(linhaCels, cIdx) {
    if (!linhaCels) return null;
    const cel = linhaCels[cIdx];
    if (!cel) return null;
    if (!cel.c) return cel;
    // Célula coberta por mesclagem: localiza a célula de origem
    for (let k = cIdx - 1; k >= 0; k--) {
      const celOrigem = linhaCels[k];
      if (celOrigem && !celOrigem.c) {
        if (celOrigem.cs && (k + celOrigem.cs > cIdx)) {
          return celOrigem;
        }
        break;
      }
    }
    return null;
  }

  /**
   * Extrai e unifica tokens da busca, tratando padrões como 't 01', 't - 1', 'turma 01'
   */
  function extrairTokensBusca(termoNorm) {
    if (!termoNorm) return [];
    const tratado = String(termoNorm).replace(/\b(?:turma|t)\s*[\-_]?\s*(\d{1,2})\b/gi, 't$1');
    return tratado.split(/\s+/).filter(Boolean);
  }

  /**
   * Identifica se um token de busca refere-se a uma turma (ex: T01, t01, T1, t1, T-01, t-1, t 01, turma 1)
   * Retorna o número inteiro da turma (ex: 1) ou null se não for padrão de turma.
   */
  function extrairNumeroTurmaBusca(token) {
    if (!token) return null;
    const m = String(token).trim().match(/^(?:turma\s*|t\s*[\-_]?\s*)0*(\d{1,2})$/i);
    return m ? parseInt(m[1], 10) : null;
  }

  /**
   * Extrai números inteiros de turma a partir do objeto da célula da grade.
   * Analisa cel.turmas (se presente) e faz fallback resiliente sobre cel.t (T01, Turma 1, T1/T2, pós SEP5864 - 1).
   * Armazena em cache na própria célula (cel._turmasNums) para consultas subsequentes O(1).
   */
  function extrairTurmasNumericasDaCelula(cel) {
    if (!cel) return [];
    if (cel._turmasNums && Array.isArray(cel._turmasNums)) {
      return cel._turmasNums;
    }
    const nums = [];
    if (cel.turmas && Array.isArray(cel.turmas)) {
      cel.turmas.forEach(t => {
        const n = parseInt(t, 10);
        if (!isNaN(n) && !nums.includes(n)) nums.push(n);
      });
    }
    if (nums.length === 0 && cel.t) {
      const reT = /(?:-\s*|\/\s*)?(?:T\s*[\-_]?\s*|Turma\s+)(\d{1,2})/gi;
      let mT;
      while ((mT = reT.exec(cel.t)) !== null) {
        const n = parseInt(mT[1], 10);
        if (!isNaN(n) && !nums.includes(n)) nums.push(n);
      }
      if (nums.length === 0) {
        const reNum = /(?:-\s*|\/\s*)(\d{1,2})(?:\s*(?:e|E|\/)\s*(\d{1,2}))?(?:\s*$|\s+(?:pv|tv|pós|pos|\/))/gi;
        let mN;
        while ((mN = reNum.exec(cel.t)) !== null) {
          if (mN[1]) {
            const n1 = parseInt(mN[1], 10);
            if (!isNaN(n1) && !nums.includes(n1)) nums.push(n1);
          }
          if (mN[2]) {
            const n2 = parseInt(mN[2], 10);
            if (!isNaN(n2) && !nums.includes(n2)) nums.push(n2);
          }
        }
      }
    }
    cel._turmasNums = nums;
    cel._temTurma = nums.length > 0;
    return nums;
  }

  /**
   * Verifica se uma célula atende a todos os tokens da busca textual,
   * considerando sigla, nome da disciplina, turma com regex resiliente,
   * docentes (inclusive múltiplos/co-docência), modalidade (direto do card: Teórica/Prática),
   * período (direto do card: Semestral/Anual) e qualquer palavra das observações.
   */
  function celulaCorrespondeABusca(cel, tokens) {
    if (!cel || !tokens || tokens.length === 0) return false;

    // Inicializa metadados estáticos da célula em cache de execução
    if (!cel._metaBusca) {
      cel._tNorm = normalizarTexto(cel.t || '');
      extrairTurmasNumericasDaCelula(cel);
      cel._temTv = /\btv\b/i.test(cel.t || '') || /teoric/i.test(cel.t || '');
      cel._temPv = /\bpv\b/i.test(cel.t || '') || /pratic/i.test(cel.t || '');
      cel._codsNorm = (cel.d || []).map(c => normalizarTexto(c));
      cel._metaBusca = true;
    }

    // Coleta dados das disciplinas da célula (cache do Jupiterweb e Janus)
    const dadosLista = [];
    if (cel.d && Array.isArray(cel.d)) {
      for (let i = 0; i < cel.d.length; i++) {
        const cod = String(cel.d[i]).trim().toUpperCase();
        if (cod) {
          const dados = obterCacheJupiter(cod);
          if (dados) dadosLista.push(dados);
        }
      }
    }

    // Identifica as turmas relevantes para esta célula a partir do Júpiterweb ou Janus
    const turmasRelevantes = [];
    let todasTurmasJupiter = [];

    dadosLista.forEach(dados => {
      if (dados.turmas) {
        const turmasObjs = Object.values(dados.turmas);
        todasTurmasJupiter = todasTurmasJupiter.concat(turmasObjs);

        if (cel._temTurma) {
          const casadas = turmasObjs.filter(t => {
            const numT = parseInt(t.numero, 10);
            if (cel._turmasNums.includes(numT)) return true;
            if (t.codigoTurma) {
              return cel._turmasNums.some(n => t.codigoTurma.endsWith(String(n).padStart(2, '0')));
            }
            return false;
          });
          if (casadas.length > 0) {
            turmasRelevantes.push(...casadas);
          } else {
            turmasRelevantes.push(...turmasObjs);
          }
        } else {
          turmasRelevantes.push(...turmasObjs);
        }
      }
    });

    const turmasParaBusca = turmasRelevantes.length > 0 ? turmasRelevantes : todasTurmasJupiter;

    // Avalia se CADA token é satisfeito pela célula
    return tokens.every(tok => {
      // 1. Token de Turma Resiliente (ex: T01, t01, T1, t1, T-01, t-1, etc.)
      const numTurmaBusca = extrairNumeroTurmaBusca(tok);
      if (numTurmaBusca !== null) {
        if (cel._temTurma) {
          return cel._turmasNums.includes(numTurmaBusca);
        }
        // Se a célula não tem turma explícita no texto/objeto
        if (cel.t) {
          const reNum = new RegExp('(?:^|[^\\w])(?:turma\\s*|t\\s*[\\-_]?\\s*)0*' + numTurmaBusca + '(?:\\b|[^\\d])', 'i');
          if (reNum.test(cel.t)) return true;
        }
        // Se a célula é puramente a sigla sem turma (ex: SMA0300 ou SEP5864), verifica se existe a turma no cache
        if (turmasParaBusca.length > 0) {
          return turmasParaBusca.some(t => parseInt(t.numero, 10) === numTurmaBusca);
        }
        return false;
      }

      // 2. Token de Modalidade (Teórica/Prática para Graduação, Presencial/Remota/Híbrida para Pós)
      const ehTeoricaToken = (tok === 'teorica' || tok === 'teorico' || tok === 'teoricas' || tok === 'teoricos' || tok === 'tv');
      const ehPraticaToken = (tok === 'pratica' || tok === 'pratico' || tok === 'praticas' || tok === 'praticos' || tok === 'pv');
      const ehPresencialToken = (tok === 'presencial' || tok === 'presenciais');
      const ehRemotaToken = (tok === 'remota' || tok === 'remoto' || tok === 'remotas' || tok === 'remotos' || tok === 'ead' || tok === 'online');
      const ehHibridaToken = (tok === 'hibrida' || tok === 'hibrido' || tok === 'hibridas' || tok === 'hibridos');

      if (ehTeoricaToken) {
        if (cel._temTv) return true;
        if (turmasParaBusca.some(t => {
          const tipoNorm = normalizarTexto(t.tipo || 'Teórica');
          return tipoNorm.includes('teor') || tipoNorm.includes('te');
        })) return true;
      }

      if (ehPraticaToken) {
        if (cel._temPv) return true;
        if (turmasParaBusca.some(t => {
          const tipoNorm = normalizarTexto(t.tipo || 'Teórica');
          return tipoNorm.includes('prat') || tipoNorm.includes('pr');
        })) return true;
      }

      if (ehPresencialToken) {
        if (turmasParaBusca.some(t => {
          const tipoNorm = normalizarTexto(t.tipo || '');
          return tipoNorm.includes('presenc');
        })) return true;
      }

      if (ehRemotaToken) {
        if (turmasParaBusca.some(t => {
          const tipoNorm = normalizarTexto(t.tipo || '');
          return tipoNorm.includes('remot') || tipoNorm.includes('ead') || tipoNorm.includes('online');
        })) return true;
      }

      if (ehHibridaToken) {
        if (turmasParaBusca.some(t => {
          const tipoNorm = normalizarTexto(t.tipo || '');
          return tipoNorm.includes('hibrid');
        })) return true;
      }

      // 3. Token de Período (diretamente como no Card: periodo || 'Semestral')
      const ehSemestralToken = (tok === 'semestral' || tok === 'semestrais' || tok === 'semestre');
      const ehAnualToken = (tok === 'anual' || tok === 'anuais' || tok === 'ano');

      if (ehSemestralToken) {
        if (cel._tNorm.includes('semestr')) return true;
        if (turmasParaBusca.length > 0 && turmasParaBusca.some(t => {
          const perNorm = normalizarTexto(t.periodo || 'Semestral');
          return perNorm.includes('semestr');
        })) return true;
      }

      if (ehAnualToken) {
        if (cel._tNorm.includes('anual') || /\bano\b/.test(cel._tNorm)) return true;
        if (turmasParaBusca.length > 0 && turmasParaBusca.some(t => {
          const perNorm = normalizarTexto(t.periodo || 'Semestral');
          return perNorm.includes('anual');
        })) return true;
      }

      // 4. Busca Geral: Sigla, Nome da Disciplina, Docentes (inclusive múltiplos), Observações e Texto da Célula
      // 4a. Texto cru da célula
      if (cel._tNorm.includes(tok)) return true;

      // 4b. Códigos de disciplina
      if (cel._codsNorm.some(c => c.includes(tok))) return true;

      // 4c. Metadados do Jupiterweb e Janus
      for (let i = 0; i < dadosLista.length; i++) {
        const dados = dadosLista[i];
        if (!dados) continue;

        // Nome da disciplina
        if (dados.nome && normalizarTexto(dados.nome).includes(tok)) return true;

        // Código da disciplina
        if (dados.codigo && normalizarTexto(dados.codigo).includes(tok)) return true;

        // Programa de pós-graduação (Janus)
        if (dados.programa && normalizarTexto(dados.programa).includes(tok)) return true;
      }

      // 4d. Docentes (inclusive múltiplos na mesma turma ou co-docência), Local e Observações
      for (let i = 0; i < turmasParaBusca.length; i++) {
        const turma = turmasParaBusca[i];
        if (!turma) continue;

        // Docentes
        if (turma.docentes && Array.isArray(turma.docentes)) {
          for (let d = 0; d < turma.docentes.length; d++) {
            if (normalizarTexto(turma.docentes[d]).includes(tok)) {
              return true;
            }
          }
        }

        // Horários com professores adicionais e local
        if (turma.horarios && Array.isArray(turma.horarios)) {
          for (let h = 0; h < turma.horarios.length; h++) {
            const hor = turma.horarios[h];
            if (hor.docente && normalizarTexto(hor.docente).includes(tok)) return true;
            if (hor.professores && Array.isArray(hor.professores)) {
              if (hor.professores.some(p => normalizarTexto(p).includes(tok))) return true;
            }
            if (hor.local && normalizarTexto(hor.local).includes(tok)) return true;
          }
        }

        // Local da turma
        if (turma.local && normalizarTexto(turma.local).includes(tok)) return true;

        // Qualquer palavra das Observações
        if (turma.observacoes && normalizarTexto(turma.observacoes).includes(tok)) {
          return true;
        }

        // Tipo e Período (caso o usuário digite texto livre que case com eles)
        if (turma.tipo && normalizarTexto(turma.tipo).includes(tok)) return true;
        if (turma.periodo && normalizarTexto(turma.periodo).includes(tok)) return true;
      }

      return false;
    });
  }

  function salaCorrespondeABusca(sala, linhaCels, slotsAtivos, tokens, termoCompletoNorm) {
    if (!tokens || tokens.length === 0) return true;

    // 1. Nome da sala (ex: "C-01", "Anfiteatro")
    if (!sala._nomeNorm) {
      sala._nomeNorm = normalizarTexto(sala.nome);
    }
    if (sala._nomeNorm.includes(termoCompletoNorm) || tokens.every(t => sala._nomeNorm.includes(t))) {
      return true;
    }

    // 2. Verifica se alguma aula/célula nos slots ativos atende à busca
    for (let i = 0; i < slotsAtivos.length; i++) {
      const cIdx = slotsAtivos[i].cIdx;
      const celEfetiva = obterCelulaEfetiva(linhaCels, cIdx);
      if (celEfetiva && (celEfetiva.t || celEfetiva.d)) {
        if (celulaCorrespondeABusca(celEfetiva, tokens)) {
          return true;
        }
      }
    }

    return false;
  }

  function resetarTodosFiltros() {
    estadoApp.diasSelecionados.clear();
    estadoApp.diasSelecionados.add('todos');
    estadoApp.blocosSelecionados.clear();

  const mapaDocentesIndexados = new Map();
  const mapaDisciplinasIndexadas = new Map();
  let indiceSugestaoTeclado = -1;

  function normalizarNomeDocente(nomeRaw) {
    if (!nomeRaw) return '';
    return String(nomeRaw)
      .replace(/\s*\([^)]*\)/g, '')
      .replace(/^(?:(?:Prof(?:a)?|Dr(?:a)?|Ms|Msc)\.?\s*)+/i, '')
      .replace(/\s+/g, ' ')
      .trim();
  }

  function indexarDocente(nomeRaw, depto, discCodigo) {
    const nomeLimpo = normalizarNomeDocente(nomeRaw);
    if (!nomeLimpo || nomeLimpo.length < 3) return;
    const nomeBaixo = normalizarTexto(nomeLimpo);
    if (nomeBaixo === 'a designar' || nomeBaixo === '-' || nomeBaixo.startsWith('sem docente')) return;

    if (!mapaDocentesIndexados.has(nomeLimpo)) {
      mapaDocentesIndexados.set(nomeLimpo, {
        nome: nomeLimpo,
        nomeNorm: nomeBaixo,
        depto: depto || '',
        disciplinas: new Set()
      });
    }

    const reg = mapaDocentesIndexados.get(nomeLimpo);
    if (depto && !reg.depto) reg.depto = depto;
    if (discCodigo) reg.disciplinas.add(discCodigo);
  }

  function indexarDisciplina(codigoRaw, nomeRaw) {
    if (!codigoRaw) return;
    const codLimpo = String(codigoRaw).trim().toUpperCase();
    const nomeLimpo = String(nomeRaw || '').replace(/\s+/g, ' ').trim();
    if (!codLimpo) return;

    if (!mapaDisciplinasIndexadas.has(codLimpo)) {
      mapaDisciplinasIndexadas.set(codLimpo, {
        codigo: codLimpo,
        nome: nomeLimpo || codLimpo,
        nomeNorm: normalizarTexto(nomeLimpo || codLimpo),
        codNorm: normalizarTexto(codLimpo)
      });
    } else if (nomeLimpo && (!mapaDisciplinasIndexadas.get(codLimpo).nome || mapaDisciplinasIndexadas.get(codLimpo).nome === codLimpo)) {
      const reg = mapaDisciplinasIndexadas.get(codLimpo);
      reg.nome = nomeLimpo;
      reg.nomeNorm = normalizarTexto(nomeLimpo);
    }
  }

  /**
   * Varre a matriz da grade ativa e compila:
   * 1. Mapa de disciplinas presentes: código -> { turmas: Set(nums), temSemTurma: boolean }
   * 2. Frequência de aulas por sigla departamental ativa (ex: 'SEM' -> 42, '760' -> 18)
   */
  function extrairDisciplinasETurmasDaGrade() {
    const mapa = new Map();
    const freqDeptos = new Map();

    if (!estadoApp.dadosBrutos || !Array.isArray(estadoApp.dadosBrutos.grade)) {
      return { disciplinas: mapa, departamentosAtivos: freqDeptos };
    }

    estadoApp.dadosBrutos.grade.forEach(linha => {
      if (!Array.isArray(linha)) return;
      linha.forEach(cel => {
        if (!cel || !cel.d || !Array.isArray(cel.d) || cel.d.length === 0) return;
        const turmasNums = extrairTurmasNumericasDaCelula(cel);

        // Deduplica departamentos na mesma célula para contagem fiel de frequência de aulas
        const deptosVistosNaCelula = new Set();

        cel.d.forEach(codRaw => {
          const cod = String(codRaw).trim().toUpperCase();
          if (!cod) return;

          // Extrai sigla departamental: 3 letras (SEM, SMA) ou 3 primeiros dígitos para IFSC (760)
          let siglaDepto = '';
          const mLetras = /^[A-Za-z]{3}/.exec(cod);
          if (mLetras) {
            siglaDepto = mLetras[0].toUpperCase();
          } else {
            const mNum = /^(\d{3})\d{4}$/.exec(cod);
            if (mNum) siglaDepto = mNum[1];
          }

          if (siglaDepto) {
            deptosVistosNaCelula.add(siglaDepto);
          }

          if (!mapa.has(cod)) {
            mapa.set(cod, { temSemTurma: false, turmas: new Set() });
          }
          const info = mapa.get(cod);
          if (turmasNums.length > 0) {
            turmasNums.forEach(t => info.turmas.add(t));
          } else {
            info.temSemTurma = true;
          }
        });

        deptosVistosNaCelula.forEach(sigla => {
          freqDeptos.set(sigla, (freqDeptos.get(sigla) || 0) + 1);
        });
      });
    });

    return { disciplinas: mapa, departamentosAtivos: freqDeptos };
  }

  /**
   * Reconstrói os índices de busca a partir exclusivamente da grade ativa
   * e dos dados em cache do Júpiterweb e Janus.
   */
  function reindexarBuscaDaGradeAtual() {
    mapaDocentesIndexados.clear();
    mapaDisciplinasIndexadas.clear();

    const { disciplinas, departamentosAtivos } = extrairDisciplinasETurmasDaGrade();
    estadoApp._mapaGradeDisciplinas = disciplinas;
    estadoApp._departamentosAtivosGrade = departamentosAtivos;

    // 1. Indexa códigos das disciplinas encontradas na grade
    disciplinas.forEach((info, cod) => {
      indexarDisciplina(cod, null);
    });

    // 2. Se houver dados em cache (Júpiterweb e Janus), enriquece nomes e docentes alocados
    if (estadoApp.cacheJupiter) {
      disciplinas.forEach((info, cod) => {
        const dados = estadoApp.cacheJupiter[cod];
        if (dados) {
          if (dados.nome) indexarDisciplina(cod, dados.nome);
          indexarDocentesDeDadosDisciplina(cod, dados);
        }
      });
    }

    // 3. Re-renderiza o dropdown se o usuário estiver com foco no campo de busca
    const inpBusca = document.getElementById('input-busca-sala');
    if (inpBusca && document.activeElement === inpBusca && typeof atualizarSugestoesBusca === 'function') {
      atualizarSugestoesBusca(inpBusca.value);
    }
  }

  // Aliases de compatibilidade
  function inicializarIndiceDocentes() {
    reindexarBuscaDaGradeAtual();
  }
  function inicializarIndiceDisciplinas() {
    reindexarBuscaDaGradeAtual();
  }

  /**
   * Indexa docentes de um objeto retornado pelo Júpiterweb ou Janus,
   * restringindo aos docentes das turmas efetivamente alocadas na grade.
   */
  function indexarDocentesDeDadosDisciplina(codigo, dados) {
    if (!dados || !dados.turmas) return;
    const codLimpo = String(codigo || '').trim().toUpperCase();
    const infoGrade = estadoApp._mapaGradeDisciplinas ? estadoApp._mapaGradeDisciplinas.get(codLimpo) : null;

    // Descarta se a disciplina não pertencer à grade ativa
    if (!infoGrade) return;

    // Sigla departamental (suporta 3 letras ou 3 dígitos do IFSC como 760)
    let depto = '';
    const mLetras = /^[A-Za-z]{3}/.exec(codLimpo);
    if (mLetras) {
      depto = mLetras[0].toUpperCase();
    } else {
      const mNum = /^(\d{3})\d{4}$/.exec(codLimpo);
      if (mNum) depto = mNum[1];
    }

    // Só restringe a turmas específicas se houver turmas cadastradas E NENHUMA aula sem turma indicada
    const temTurmasRestritas = (infoGrade.turmas.size > 0 && !infoGrade.temSemTurma);
    const turmasPermitidas = infoGrade.turmas;

    const turmasObjs = Object.values(dados.turmas);
    turmasObjs.forEach(t => {
      if (temTurmasRestritas) {
        const numT = parseInt(t.numero || t.ofe, 10);
        let casaTurma = !isNaN(numT) && turmasPermitidas.has(numT);
        if (!casaTurma && t.codigoTurma) {
          casaTurma = Array.from(turmasPermitidas).some(n => t.codigoTurma.endsWith(String(n).padStart(2, '0')));
        }
        if (!casaTurma) return;
      }

      if (t.docentes && Array.isArray(t.docentes)) {
        t.docentes.forEach(d => indexarDocente(d, depto, codLimpo));
      }
      if (t.horarios && Array.isArray(t.horarios)) {
        t.horarios.forEach(h => {
          if (h.docente) indexarDocente(h.docente, depto, codLimpo);
          if (h.professores && Array.isArray(h.professores)) {
            h.professores.forEach(p => indexarDocente(p, depto, codLimpo));
          }
        });
      }
    });
  }

  function buscarSugestoes(termo) {
    const termoStr = String(termo || '').trim();
    const gradeCarregando = !estadoApp.dadosBrutos || !estadoApp._departamentosAtivosGrade;
    const deptosAtivosMap = estadoApp._departamentosAtivosGrade || new Map();

    if (!termoStr) {
      let departamentosSugeridos = [];
      if (!gradeCarregando) {
        departamentosSugeridos = CATALOGO_DEPARTAMENTOS
          .filter(dep => deptosAtivosMap.has(dep.sigla))
          .sort((a, b) => {
            const freqDiff = (deptosAtivosMap.get(b.sigla) || 0) - (deptosAtivosMap.get(a.sigla) || 0);
            if (freqDiff !== 0) return freqDiff;
            return a.sigla.localeCompare(b.sigla);
          })
          .slice(0, 8);
      }

      return {
        termo: '',
        ehVazio: true,
        gradeCarregando: gradeCarregando,
        departamentos: departamentosSugeridos,
        disciplinas: [],
        docentes: [],
        acoesRapidas: [
          { rotulo: '⚡ Horário de Agora', acao: 'agora' },
          { rotulo: '⚡ Focar em Hoje', acao: 'hoje' },
          { rotulo: '🧹 Limpar Filtros', acao: 'limpar', alinharDireita: true }
        ]
      };
    }

    const tNorm = normalizarTexto(termoStr);

    // 1. Departamentos (Restrito ESTRITAMENTE aos departamentos com aulas na grade ativa)
    const deptosEncontrados = [];
    CATALOGO_DEPARTAMENTOS.forEach(dep => {
      if (!deptosAtivosMap.has(dep.sigla)) return;

      const sNorm = normalizarTexto(dep.sigla);
      const nNorm = normalizarTexto(dep.nome);
      const aNorm = normalizarTexto(dep.apelido);
      let pontuacao = 0;

      if (sNorm === tNorm) {
        pontuacao = 100;
      } else if (sNorm.startsWith(tNorm)) {
        pontuacao = 80;
      } else if (sNorm.includes(tNorm)) {
        pontuacao = 60;
      } else if (aNorm.startsWith(tNorm) || nNorm.startsWith(tNorm)) {
        pontuacao = 50;
      } else if (aNorm.includes(tNorm) || nNorm.includes(tNorm)) {
        pontuacao = 40;
      } else if (dep.keywords && dep.keywords.some(k => normalizarTexto(k).includes(tNorm))) {
        pontuacao = 30;
      }

      if (pontuacao > 0) {
        deptosEncontrados.push({ ...dep, pontuacao });
      }
    });

    deptosEncontrados.sort((a, b) => b.pontuacao - a.pontuacao);

    // 2. Disciplinas (quando termo tem pelo menos 2 caracteres, ou match em código)
    const disciplinasEncontradas = [];
    if (termoStr.length >= 2) {
      mapaDisciplinasIndexadas.forEach(disc => {
        let pontuacaoSigla = 0;
        let pontuacaoNome = 0;

        // 2a. Casamento por Código / Sigla
        if (disc.codNorm === tNorm) {
          pontuacaoSigla = 100;
        } else if (disc.codNorm.startsWith(tNorm)) {
          pontuacaoSigla = 85;
        } else if (disc.codNorm.includes(tNorm)) {
          pontuacaoSigla = 55;
        }

        // 2b. Casamento por Nome (apenas se enriquecido e distinto do código)
        const temNomeValido = disc.nome && disc.nome !== disc.codigo;
        if (temNomeValido) {
          const partesNome = disc.nomeNorm.split(/\s+/);
          if (disc.nomeNorm === tNorm) {
            pontuacaoNome = 95;
          } else if (disc.nomeNorm.startsWith(tNorm)) {
            pontuacaoNome = 75;
          } else if (partesNome.some(p => p.startsWith(tNorm))) {
            pontuacaoNome = 65;
          } else if (disc.nomeNorm.includes(tNorm)) {
            pontuacaoNome = 45;
          }
        }

        const pontuacao = Math.max(pontuacaoSigla, pontuacaoNome);
        if (pontuacao > 0) {
          const matchPor = pontuacaoNome > pontuacaoSigla ? 'nome' : 'sigla';
          const valorInsercao = matchPor === 'nome' ? disc.nome : disc.codigo;

          disciplinasEncontradas.push({
            codigo: disc.codigo,
            nome: disc.nome,
            pontuacao: pontuacao,
            matchPor: matchPor,
            valorInsercao: valorInsercao
          });
        }
      });

      disciplinasEncontradas.sort((a, b) => b.pontuacao - a.pontuacao || a.codigo.localeCompare(b.codigo));
    }

    // 3. Docentes
    const docentesEncontrados = [];
    mapaDocentesIndexados.forEach(doc => {
      let pontuacao = 0;
      const partesNome = doc.nomeNorm.split(/\s+/);

      if (doc.nomeNorm.startsWith(tNorm)) {
        pontuacao = 80;
      } else if (partesNome.some(p => p.startsWith(tNorm))) {
        pontuacao = 60;
      } else if (doc.nomeNorm.includes(tNorm)) {
        pontuacao = 40;
      }

      if (pontuacao > 0) {
        docentesEncontrados.push({
          nome: doc.nome,
          depto: doc.depto,
          pontuacao: pontuacao
        });
      }
    });

    docentesEncontrados.sort((a, b) => b.pontuacao - a.pontuacao);

    return {
      termo: termoStr,
      ehVazio: false,
      gradeCarregando: false,
      departamentos: deptosEncontrados.slice(0, 6),
      disciplinas: disciplinasEncontradas.slice(0, 5),
      docentes: docentesEncontrados.slice(0, 6),
      acoesRapidas: []
    };
  }

  function atualizarSugestoesBusca(termo) {
    const popover = document.getElementById('busca-sugestoes-dropdown');
    if (!popover) return;

    const res = buscarSugestoes(termo);
    const temDeptos = res.departamentos.length > 0;
    const temDisciplinas = res.disciplinas && res.disciplinas.length > 0;
    const temDocs = res.docentes.length > 0;
    const temAcoes = (res.acoesRapidas && res.acoesRapidas.length > 0);

    if (!temDeptos && !temDisciplinas && !temDocs && !temAcoes && !res.gradeCarregando) {
      fecharSugestoesBusca();
      return;
    }

    let html = '';

    if (temAcoes) {
      html += `
        <div class="sugestoes-secao">
          <div class="sugestoes-secao-header">
            <span class="sugestoes-secao-titulo"><span>⚡</span> Atalhos Rápidos</span>
          </div>
          <div class="sugestoes-chips-grid sugestoes-acoes-grid">
            ${res.acoesRapidas.map(a => `
              <button type="button" class="chip-sugestao chip-acao-rapida ${a.alinharDireita || a.acao === 'limpar' ? 'chip-acao-direita' : ''}" data-valor="${a.acao}" data-tipo="acao">
                ${escapeHtml(a.rotulo)}

          </div>
        </div>

    if (res.gradeCarregando && res.ehVazio) {
      html += `
        <div class="sugestoes-secao">
          <div class="sugestoes-secao-header">
            <span class="sugestoes-secao-titulo"><span>⏳</span> Carregando Grade...</span>

          <div class="sugestoes-secao-header">

              <button type="button" class="chip-sugestao chip-depto" data-valor="${d.sigla}" data-tipo="depto" title="${escapeHtml(d.nome)} (${d.unidade})">

    }

    if (temDisciplinas) {
      html += `
        <div class="sugestoes-secao">
          <div class="sugestoes-secao-header">
            <span class="sugestoes-secao-titulo"><span>📚</span> Disciplinas</span>
            <span class="sugestoes-secao-count">${res.disciplinas.length}</span>
          </div>
          <div class="sugestoes-chips-grid">
            ${res.disciplinas.map(disc => {
              const valorIns = disc.valorInsercao || disc.codigo;
              const temNome = disc.nome && disc.nome !== disc.codigo;
              const tooltip = temNome 
                ? `Filtrar por ${escapeHtml(valorIns)} (${escapeHtml(disc.codigo)})`
                : `Filtrar por ${escapeHtml(valorIns)}`;

              return `
                <button type="button" 
                        class="chip-sugestao chip-disciplina" 
                        data-valor="${escapeHtml(valorIns)}" 
                        data-tipo="disciplina" 
                        title="${tooltip}">
                  <span class="chip-sugestao-sigla">${escapeHtml(disc.codigo)}</span>
                  <span class="chip-sugestao-rotulo">${escapeHtml(disc.nome)}</span>

            }).join('')}
          </div>

      `;

    if (temDocs) {
      html += `
        <div class="sugestoes-secao">
          <div class="sugestoes-secao-header">
            <span class="sugestoes-secao-titulo"><span>👨‍🏫</span> Docentes</span>
            <span class="sugestoes-secao-count">${res.docentes.length}</span>

          <div class="sugestoes-chips-grid">

                <span class="chip-sugestao-rotulo">${escapeHtml(doc.nome)}</span>

    html += `

      </div>

    popover.innerHTML = html;
    popover.style.display = 'flex';
    indiceSugestaoTeclado = -1;

    const inpBusca = document.getElementById('input-busca-sala');
    if (inpBusca) {
      inpBusca.setAttribute('aria-expanded', 'true');
